project: Nabaperks
imagemagick: true

environments:
  local:
    url: http://localhost:3000
    restrictions:
      - Only use seeded local data.
      - Do not create durable production users or production payment records.
    notes:
      - Uses a disposable local Supabase stack.
      - Customer OTP uses CUSTOMER_DEV_OTP_CODE=424242.
default_target: local
execution:
  mode: local-only
  notes:
    - QA is run from a local Droid session against localhost.
    - No GitHub Actions workflow, Factory API key, or remote automation is required.
    - Start local Supabase and the local dev server before browser QA.

auth:
  method: mixed
  provider: Supabase Auth for merchant/admin, Twilio Verify for customer phone OTP
  local_otp_env: CUSTOMER_DEV_OTP_CODE
  local_otp_value: "424242"

personas:
  - name: guest
    description: Unauthenticated visitor.
    email: null
    credentials_source: none
    test_focus:
      - marketing pages
      - unavailable QR and merchant pages
      - login and join entry points
    cannot_do:
      - access merchant console
      - access admin console
      - stamp or redeem without OTP verification
  - name: customer
    description: Seeded loyalty customer using the demo customer flow.
    email: null
    phone: "07467586751"
    credentials_source: seeded-local-data
    secret_name: CUSTOMER_DEV_OTP_CODE
    test_focus:
      - QR join
      - OTP verification
      - card viewing
      - self-service stamping
      - reward unlock and redemption handoff
    cannot_do:
      - access merchant console
      - access admin console
      - redeem a reward before it is ready
  - name: merchant
    description: Seeded merchant owner for Old Crown Girton.
    email: mia@old-crown-girton.test
    credentials_source: env-var
    secret_name: QA_SEEDED_PASSWORD
    test_focus:
      - merchant login
      - onboarding and launch readiness
      - QR setup and preview
      - rewards and card settings
      - billing surface
      - customer/activity readbacks
    cannot_do:
      - access admin console
      - view raw customer phone data
  - name: admin
    description: Seeded internal support admin.
    email: admin@nabaperks.test
    credentials_source: env-var
    secret_name: QA_SEEDED_PASSWORD
    test_focus:
      - admin dashboards
      - customer support actions
      - merchant support readbacks
      - fraud, billing, audit, privacy, and pilot surfaces
    cannot_do:
      - bypass production MFA
      - mutate production data during QA

apps:
  web:
    path_patterns:
      - app/**
      - components/**
      - lib/**
      - public/**
      - styles/**
      - config/**
      - supabase/**
    skill: qa-web
    test_tool: agent-browser
    dev_command: pnpm dev
    build_command: pnpm build

feature_flags:
  provider: none
  dashboard_url: null
  how_to_override: >
    No external feature flag provider was detected. Use environment toggles such as
    CUSTOMER_FLOW_DEV_HARNESS_ENABLED=true, CUSTOMER_DEV_OTP_CODE=424242, and
    CUSTOMER_OTP_BYPASS_MODE only in non-production environments.

integrations:
  supabase:
    provider: Supabase
    mode: local stack for default QA
    setup_command: supabase start && pnpm db:setup
  stripe:
    provider: Stripe Billing
    mode: test placeholders in local QA
    publishable_key_env: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret_key_env: STRIPE_SECRET_KEY
  sms:
    provider: Twilio Verify
    mode: skipped in local QA via CUSTOMER_DEV_OTP_CODE=424242
  email:
    provider: Resend
    mode: placeholder in local QA unless a flow explicitly tests delivery
  analytics:
    provider: PostHog optional
    mode: best-effort mirror, not required for functional QA
  push:
    provider: Web Push VAPID
    mode: optional, only test browser permission and preference UI unless keys are present
  maps:
    provider: Google Places optional
    mode: fallback to manual venue entry if NEXT_PUBLIC_GOOGLE_MAPS_API_KEY is absent

cleanup:
  auto_cleanup: false
  strategy: none
  instructions: Use seeded local resettable data. If a run needs a clean slate, run pnpm db:setup or pnpm customer-flow:reset.

failure_learning: suggest_in_report
