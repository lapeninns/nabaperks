<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body { padding: 16px 22px; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { PinPad, OtpBoxes, MonoLine } = window.NabaperksDesignSystemHoneyInk_4fb4ef;
function Demo() {
  const [code, setCode] = React.useState("4829");
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, alignItems: "start" }}>
      <div style={{ transform: "scale(0.78)", transformOrigin: "top center" }}>
        <PinPad label="Staff: stamp this card" sublabel="Customer hands the phone across the counter" />
      </div>
      <div style={{ paddingTop: 26 }}>
        <MonoLine style={{ textAlign: "center", marginBottom: 14 }}>Keep your card — enter the code</MonoLine>
        <OtpBoxes length={6} value={code} onChange={setCode} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
