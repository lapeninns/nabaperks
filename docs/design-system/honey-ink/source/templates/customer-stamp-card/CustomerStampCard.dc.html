<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Customer stamp card" description="Wet Ink mobile stamp card — receipt surface, stamp row, mystery seal teaser, counter CTA." -->
<helmet>
<script src="./ds-base.js"></script>
</helmet>
<div style="min-height:100vh; background:#f6f1e6; font-family:'Bricolage Grotesque', system-ui, sans-serif; color:#211c16; display:flex; justify-content:center;">
  <div style="width:100%; max-width:410px; padding:26px 20px 60px; box-sizing:border-box;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;">
      <div style="display:flex; align-items:center; gap:9px;">
        <span style="width:26px; height:26px; border-radius:50%; background:#e8430f; border:2px solid #211c16; display:inline-grid; place-items:center; color:#ffffff; font-weight:800; font-size:13px; transform:rotate(-6deg);">✱</span>
        <span style="font-weight:800; font-size:16.5px; letter-spacing:-0.01em;">nabaperks</span>
      </div>
      <x-import component-from-global-scope="NabaperksDesignSystemHoneyInk_4fb4ef.MonoTag" tone="ink" hint-size="70px,26px">Saved</x-import>
    </div>
    <h1 style="font-size:26px; font-weight:800; margin:0 0 18px;">Your card</h1>
    <div style="filter:drop-shadow(4px 4px 0 #211c16);">
      <div style="background:#fbf8f1; border:2px solid #211c16; border-bottom:none; border-radius:10px 10px 0 0; padding:20px 20px 14px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
          <div>
            <div style="font-family:'Space Mono', monospace; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:#6b6257;">The Old Crown · Bristol</div>
            <div style="font-weight:800; font-size:21px; line-height:1.12; margin-top:5px;">Free hot drink after 3 visits</div>
          </div>
          <x-import component-from-global-scope="NabaperksDesignSystemHoneyInk_4fb4ef.VenueMark" size="{{ markSize }}" hint-size="62px,62px"></x-import>
        </div>
        <div style="border-top:2px dashed rgba(33,28,22,0.18); margin:14px 0;"></div>
        <x-import component-from-global-scope="NabaperksDesignSystemHoneyInk_4fb4ef.StampRow" current="{{ current }}" total="{{ total }}" dates="{{ dates }}" hint-size="100%,70px"></x-import>
        <div style="border-top:2px dashed rgba(33,28,22,0.18); margin:14px 0;"></div>
        <x-import component-from-global-scope="NabaperksDesignSystemHoneyInk_4fb4ef.ProgressLine" current="{{ current }}" total="{{ total }}" label="Visits" hint-size="100%,40px"></x-import>
        <div style="margin-top:14px; padding:12px 14px; border-radius:10px; border:2px dashed rgba(33,28,22,0.18); display:flex; gap:12px; align-items:center;">
          <div style="width:40px; height:40px; border-radius:50%; background:#f5a623; border:2px solid #211c16; display:grid; place-items:center; font-weight:800; font-size:19px; transform:rotate(-6deg); flex-shrink:0;">?</div>
          <div>
            <div style="font-weight:700; font-size:14.5px;">Mystery reward, sealed</div>
            <div style="font-size:13px; color:#6b6257;">1 more visit to break it open.</div>
          </div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:14px;">
          <div style="font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#6b6257;">CARD Nº OC-0248</div>
          <div style="font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#6b6257;">SAVED TO 07123···89</div>
        </div>
      </div>
      <div style="height:12px; margin-top:-1px; background:linear-gradient(-45deg, transparent 8.5px, #211c16 8.5px, #211c16 11px, #fbf8f1 11px) 0 0 / 17px 100%, linear-gradient(45deg, transparent 8.5px, #211c16 8.5px, #211c16 11px, #fbf8f1 11px) 0 0 / 17px 100%;"></div>
    </div>
    <div style="margin-top:22px;">
      <x-import component-from-global-scope="NabaperksDesignSystemHoneyInk_4fb4ef.InkButton" variant="dark" full="{{ yes }}" hint-size="100%,54px">I'm at the counter — stamp it</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { current: 2, total: 3, dates: ["3 JUN", "9 JUN"], markSize: 62, yes: true };
  }
}
</script>
</body>
</html>
