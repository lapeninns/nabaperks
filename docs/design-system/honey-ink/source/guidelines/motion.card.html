<!-- @dsCard group="Spacing" viewport="700x180" name="Motion vocabulary" subtitle="One slam easing, one standard easing — press, slam, shake, ripple" -->
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
body { padding: 18px 24px; }
table { width: 100%; border-collapse: collapse; font-family: var(--w-mono); font-size: 11px; }
td { padding: 6px 8px; border-top: 2px dashed var(--w-line); color: var(--w-ink-soft); }
td:first-child { color: var(--w-ink); font-weight: 700; }
tr:first-child td { border-top: none; }
.demo { width: 40px; height: 40px; border-radius: 50%; background: var(--w-accent); border: 2px solid var(--w-ink); display: grid; place-items: center; color: #fff; font-family: var(--w-display); font-weight: 800; transform: rotate(-6deg); }
</style>
</head>
<body style="display: flex; gap: 22px; align-items: center;">
<div class="demo">✱</div>
<table>
<tr><td>w-slam</td><td>380ms · var(--w-ease-slam) · scale 2.6→1, rotate to -6°</td><td>stamp lands</td></tr>
<tr><td>w-shake</td><td>300ms · the paper reacts to the slam</td><td>card shake</td></tr>
<tr><td>press</td><td>90ms · translate(3,3), shadow collapses</td><td>every button</td></tr>
<tr><td>w-sheet-up</td><td>320ms · var(--w-ease)</td><td>PIN sheet</td></tr>
<tr><td>w-splat / w-confetti / w-ripple</td><td>480–900ms one-shot particles</td><td>celebrations</td></tr>
</table>
</body>
</html>
