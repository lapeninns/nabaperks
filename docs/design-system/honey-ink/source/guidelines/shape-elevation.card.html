<!-- @dsCard group="Spacing" viewport="700x190" name="Shape & elevation" subtitle="2px ink borders, hard offset shadows (never blurred), 10px radius" -->
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
body { padding: 22px 24px; display: flex; gap: 26px; align-items: center; }
.lab { font-family: var(--w-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--w-ink-soft); margin-top: 10px; text-align: center; }
.box { width: 110px; height: 64px; background: var(--w-card); }
</style>
</head>
<body>
<div><div class="box" style="border: var(--w-border); border-radius: var(--w-r); box-shadow: var(--w-shadow);"></div><div class="lab">--w-shadow · 4px 4px 0</div></div>
<div><div class="box" style="border: var(--w-border); border-radius: var(--w-r); box-shadow: var(--w-shadow-sm);"></div><div class="lab">--w-shadow-sm · 3px 3px 0</div></div>
<div><div class="box" style="border: var(--w-border); border-radius: var(--w-r); box-shadow: var(--w-shadow-pressed); transform: translate(3px,3px);"></div><div class="lab">pressed · 1px 1px 0</div></div>
<div><div class="box" style="border: var(--w-border-dashed); border-radius: var(--w-r); background: transparent;"></div><div class="lab">dashed · empty/demo</div></div>
<div><div class="box" style="border: var(--w-border); border-radius: 50%; width: 64px;"></div><div class="lab">circles · stamps only</div></div>
</body>
</html>
