<!-- @dsCard group="Colors" viewport="700x150" name="Paper & ink" subtitle="The base relationship — warm paper, warm near-black ink" -->
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
body { padding: 16px 20px; display: flex; gap: 12px; }
.sw { flex: 1; }
.chip { height: 70px; border: 2px solid var(--w-ink); border-radius: var(--w-r); }
.lab { font-family: var(--w-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; color: var(--w-ink-soft); }
</style>
</head>
<body>
<div class="sw"><div class="chip" style="background: var(--w-paper);"></div><div class="lab">--w-paper · #F6F1E6</div></div>
<div class="sw"><div class="chip" style="background: var(--w-paper-2);"></div><div class="lab">--w-paper-2 · #ECE5D4</div></div>
<div class="sw"><div class="chip" style="background: var(--w-card);"></div><div class="lab">--w-card · #FBF8F1</div></div>
<div class="sw"><div class="chip" style="background: var(--w-ink);"></div><div class="lab">--w-ink · #211C16</div></div>
<div class="sw"><div class="chip" style="background: var(--w-ink-soft);"></div><div class="lab">--w-ink-soft · #6B6257</div></div>
</body>
</html>
