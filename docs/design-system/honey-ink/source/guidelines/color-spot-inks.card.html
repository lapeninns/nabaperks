<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
body { padding: 16px 20px; display: flex; gap: 12px; }
.sw { flex: 1; }
.chip { height: 70px; border: 2px solid var(--w-ink); border-radius: var(--w-r); }
.lab { font-family: var(--w-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px; color: var(--w-ink-soft); }
</style>
</head>
<body>
<div class="sw"><div class="chip" style="background: var(--w-accent);"></div><div class="lab">--w-accent · vermillion (action/stamp)</div></div>
<div class="sw"><div class="chip" style="background: var(--w-cobalt);"></div><div class="lab">--w-cobalt · info/joins</div></div>
<div class="sw"><div class="chip" style="background: var(--w-leaf);"></div><div class="lab">--w-leaf · success/ready</div></div>
<div class="sw"><div class="chip" style="background: var(--w-sun);"></div><div class="lab">--w-sun · the mystery seal</div></div>
</body>
</html>
