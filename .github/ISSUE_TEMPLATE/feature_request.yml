name: Feature / change request
description: Propose a change as a small, declarative Micro-Spec.
labels: ["type: feature", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Frame the request as a Micro-Spec outcome ("what must be true"), not the implementation. Do not include real customer phone numbers or other personal data.
  - type: dropdown
    id: risk-class
    attributes:
      label: Risk / surface
      description: Pick the closest risk class from micro-specs/README.md.
      options:
        - docs-tooling
        - ui-only
        - product-analytics
        - customer-pii
        - auth-session
        - billing
        - webhooks
        - rls-rpc-ledger
        - migrations
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What must be true when this is done?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why it matters
      description: The user or business problem this solves.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirement candidates
      description: e.g. "When a customer scans the venue QR, the system shall …"
      value: |
        - When <trigger>, the system shall <response>.
        - While <state>, the system shall <response>.
    validations:
      required: false
  - type: input
    id: blast-radius
    attributes:
      label: Blast radius
      description: Which files / directories should this touch, and what is out of scope?
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification expectations
      description: How will we know it works?
    validations:
      required: false
