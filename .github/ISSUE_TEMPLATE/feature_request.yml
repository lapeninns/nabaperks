name: Feature / change request
description: Propose a change as a small, declarative Micro-Spec.
labels: ["type: feature", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Frame the request as the end state ("what must be true"), not the implementation.
  - type: textarea
    id: outcome
    attributes:
      label: Desired end state
      description: What must be true when this is done?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why it matters
      description: The user or business problem this solves.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: EARS-style requirements
      description: e.g. "When a customer scans the venue QR, the system shall …"
      value: |
        - When <trigger>, the system shall <response>.
        - While <state>, the system shall <response>.
    validations:
      required: false
  - type: input
    id: blast-radius
    attributes:
      label: Blast radius
      description: Which files / directories should this touch?
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification criteria
      description: How will we know it works?
    validations:
      required: false
