name: Bug report
description: Something in Nabaperks is not behaving as expected.
labels: ["type: bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please do not include real customer phone numbers or other personal data.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where did this happen?
      options:
        - Customer (QR / join / card / home)
        - Merchant console
        - Admin console
        - API / webhook
        - Tooling / CI
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device / browser / deploy (production, preview, local).
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs, request id, or screenshots
      description: Include the `x-request-id` response header if you have it — it correlates server logs.
    validations:
      required: false
