name: Bug report
description: Something in Nabaperks is not behaving as expected.
labels: ["type: bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please do not include real customer phone numbers or other personal data. Triage will map this into a Micro-Spec outcome, scope, risk class, and verification plan before implementation.
  - type: dropdown
    id: risk-class
    attributes:
      label: Governance risk class
      description: Pick the closest class so required evidence is clear.
      options:
        - docs-tooling
        - ui-only
        - product-analytics
        - customer-pii
        - auth-session
        - billing
        - webhooks
        - rls-rpc-ledger
        - migrations
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where did this happen?
      options:
        - Customer (QR / join / card / home)
        - Merchant console
        - Admin console
        - API / webhook
        - Tooling / CI
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened / outcome needed
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and scope
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device / browser / deploy (production, preview, local).
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Logs, request id, screenshots, or verification evidence
      description: Include the `x-request-id` response header if you have it — it correlates server logs.
    validations:
      required: false
