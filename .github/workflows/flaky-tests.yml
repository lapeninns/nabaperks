name: Flaky test sweep

# Runs the suite repeatedly with randomised ordering to surface order- or
# timing-dependent tests before they erode trust. Nightly + on demand.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Number of shuffled suite runs
        default: "5"
        required: false

permissions:
  contents: read

jobs:
  flaky:
    name: Repeat suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Repeat-run the suite (shuffled)
        run: pnpm test:flaky --runs=${{ github.event.inputs.runs || '5' }} --sequence.shuffle
