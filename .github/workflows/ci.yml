name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Shared non-secret CI fixture. Every job inherits this baseline; jobs layer
# their own extras on top (the fast lane adds the strict production-profile
# values, browser tiers add the dev OTP code, the DB tier adds local Supabase
# wiring). Values are deliberate placeholders, never real credentials.
env:
  NEXT_PUBLIC_APP_URL: https://example.test
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_GROWTH_PRICE_ID: price_ci
  STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
  RESEND_API_KEY: re_ci
  TWILIO_ACCOUNT_SID: ACci
  TWILIO_AUTH_TOKEN: ci-twilio-auth-token
  TWILIO_VERIFY_SERVICE_SID: VAci
  CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
  CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
  CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b

# The three lanes below are the hosted equivalent of `pnpm quality:check`,
# split so feedback fails fast: the fast lane gates every dev-server browser
# tier, the quality lane carries the hygiene sweeps, and the production
# bundle is built exactly once and shared with Lighthouse + ZAP as an
# artifact. The gate job folds all three lanes into the long-standing
# required check name "Typecheck and build".
jobs:
  fast:
    name: Fast lane (lint, typecheck, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_GROWTH_ANNUAL_PRICE_ID: price_annual_ci
      RESEND_FROM: Nabaperks CI <ci@example.test>
      CRON_SECRET: "N7!qL2@vR9#cT4$yH6^mK8&pD3*zF5?x"
      PRODUCTION_MONITOR_SECRET: "P4@wS8#nC2!kV6$rJ9^tB3&yM7*zQ5?e"
      CUSTOMER_SESSION_SECRET: "H9!mD4@qL7#vR2$tK8^xC5&pN3*zW6?g"
      CUSTOMER_PHONE_HMAC_SECRET: "Q6!rF3@wM8#kT2$yP9^cD4&vL7*zN5?h"
      CUSTOMER_PHONE_ENCRYPTION_KEY: "V2!pK7@mR4#xH9$cF3^nQ8&wT5*zD6?j"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Configure non-secret CI VAPID fixture
        run: node scripts/generate-ci-vapid-env.mjs >> "$GITHUB_ENV"
      - name: Configure non-secret CI auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec VTghZE0zQGtSNyN2SDIkY1E5XnBMNSZ3RjQqek42P3g= >> "$GITHUB_ENV"
      - run: pnpm env:check:production
      - run: pnpm security:audit --ignore-registry-errors
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:contracts
      # Four tests in tests/unit/google-review-pdf.test.mjs render through a
      # real Chromium (google-review-pdf -> google-review-pdf-render ->
      # print-kit-browser -> chromium.launch()), so the unit tier needs a
      # browser just like the E2E tiers do. This has never been exercised here:
      # `security:audit` above has failed on every run since those tests landed,
      # short-circuiting the job before `test:coverage`.
      - name: Install Chromium for the browser-backed unit tests
        uses: ./.github/actions/playwright
        with:
          project: chromium
      # The unit suite runs exactly once, with coverage thresholds enforced.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  quality:
    name: Quality lane (hygiene sweeps)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm deadcode:check
      - run: pnpm duplicates:check
      - run: pnpm debt:check
      - run: pnpm flags:check
      - run: pnpm docs:check
      - run: pnpm agents:check
      - run: pnpm tokens:check
      - run: pnpm claims:check
      # Keep the vector/pdf-lib poster geometry proof, then render the exact
      # Playwright production bundle (duplex posters, tents, cards and plates)
      # so the release gate cannot pass against a stand-in PDF path.
      - name: Install PDF QA tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick
          python3 -m pip install --quiet opencv-python-headless pymupdf
      - name: Install Chromium for production print-kit rendering
        uses: ./.github/actions/playwright
        with:
          project: chromium
      - name: Verify pdf-lib poster geometry
        run: pnpm posters:verify-pdfs
      - name: Verify production preview print-kit PDFs
        env:
          PRINT_KIT_PREVIEW_ORIGIN: http://127.0.0.1:3000
        run: |
          preview_log="$RUNNER_TEMP/print-kit-preview.log"
          pnpm exec next dev --webpack -H 127.0.0.1 > "$preview_log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --silent --fail \
              "$PRINT_KIT_PREVIEW_ORIGIN/dev/poster-preview?template=seal" \
              >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$preview_log"
            exit 1
          fi

          pnpm posters:verify-production-pdfs

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm bundle:check
      - run: pnpm jsonld:check
      - name: Share production bundle with Lighthouse and ZAP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: next-build
          include-hidden-files: true
          path: |
            .next
            !.next/cache
          retention-days: 1

  build-gate:
    name: Typecheck and build
    needs: [fast, quality, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every lane
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$FAST_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  e2e:
    name: E2E (${{ matrix.project }}, shard ${{ matrix.shard }})
    needs: fast
    runs-on: ubuntu-latest
    # WebKit system dependencies can consume the former ten-minute whole-job
    # budget before a shard starts. Keep the lane bounded while allowing the
    # browser install and the single-worker test shard to complete.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari, desktop-firefox, desktop-safari]
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      # The dev-server tier is single-worker on purpose: under two parallel
      # workers the webpack dev server intermittently 500s mid-suite
      # (`__webpack_modules__[moduleId] is not a function` on /signup/verify,
      # observed 2026-07-20), and failOnFlakyTests turns any recovery into a
      # red run. Wall-clock parallelism comes from sharding instead.
      PLAYWRIGHT_WORKERS: "1"
      # Regular Chromium avoids process-level SIGSEGV flakes from the separate
      # headless-shell binary. Visual CI intentionally retains that shell so
      # its approved pixel baselines keep one stable rendering engine.
      PLAYWRIGHT_REGULAR_CHROMIUM: "1"
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Install project browser
        uses: ./.github/actions/playwright
        with:
          project: ${{ matrix.project }}
      - run: pnpm test:e2e -- --project="${{ matrix.project }}" --grep-invert @visual --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-gate:
    name: E2E (DB-free harness tier)
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser shard
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$E2E_RESULT" = "success"

  a11y:
    name: Accessibility (${{ matrix.project }}, shard ${{ matrix.shard }})
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari]
        shard: [1/2, 2/2]
    env:
      PLAYWRIGHT_WORKERS: "1"
      PLAYWRIGHT_REGULAR_CHROMIUM: "1"
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Install project browser
        uses: ./.github/actions/playwright
        with:
          project: ${{ matrix.project }}
      - run: pnpm test:a11y -- --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: a11y-playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  a11y-gate:
    name: Accessibility sweep
    needs: a11y
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every accessibility project
        env:
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: test "$A11Y_RESULT" = "success"

  visual:
    name: Visual regression (${{ matrix.project }}, shard ${{ matrix.shard }})
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari]
        shard: [1/2, 2/2]
    env:
      # Pixel snapshots stay single-worker on purpose: parallel load shifts
      # paint timing and would destabilise the blessed baselines.
      PLAYWRIGHT_WORKERS: "1"
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Install project browser
        uses: ./.github/actions/playwright
        with:
          project: ${{ matrix.project }}
      - run: pnpm test:visual -- --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: visual-playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-gate:
    name: Visual regression
    needs: visual
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every visual project
        env:
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: test "$VISUAL_RESULT" = "success"

  lighthouse:
    name: Lighthouse (${{ matrix.route }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: home
            url: http://127.0.0.1:3130/
          - route: pricing
            url: http://127.0.0.1:3130/pricing
          - route: loyalty-for-pubs
            url: http://127.0.0.1:3130/loyalty-for-pubs
          - route: signup
            url: http://127.0.0.1:3130/signup
    env:
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Reuse the production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: next-build
          path: .next
      - run: pnpm lighthouse -- --collect.url="${{ matrix.url }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report-${{ matrix.route }}
          path: reports/lighthouse/
          retention-days: 7

  lighthouse-gate:
    name: Lighthouse CI
    needs: lighthouse
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every Lighthouse route
        env:
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: test "$LIGHTHOUSE_RESULT" = "success"

  zap-baseline:
    name: ZAP baseline
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Reuse the production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: next-build
          path: .next
      - run: |
          pnpm start > /tmp/nabaperks-zap.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-zap.log
          exit 1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false

  db:
    name: DB behavioral moat
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_SEND_EMAIL_HOOK_URI: http://host.docker.internal:3147/api/auth/hooks/send-email
      SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.106.0
      - name: Configure local auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec dGVzdF9zdXBhYmFzZV9ob29rX3NlY3JldF8zMl9ieXRlcw== >> "$GITHUB_ENV"
      - run: supabase start
      - run: pnpm db:seed
      - run: pnpm test:db
      - run: supabase stop --no-backup
        if: always()

  db-gate:
    name: DB behavioral moat gate
    needs: db
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Stable required-check name so branch protection can block a merge when
      # the live Postgres/RLS/RPC moat is red. Mirrors e2e-gate/a11y-gate; the
      # `db` job is not folded into any other rollup, so without this a broken
      # ledger invariant could merge (QA plan R-01). Mark this required in
      # branch protection.
      - name: Require the DB behavioral moat to pass
        env:
          DB_RESULT: ${{ needs.db.result }}
        run: test "$DB_RESULT" = "success"

  release-gate:
    name: Release gate
    needs:
      - build-gate
      - e2e-gate
      - a11y-gate
      - visual-gate
      - lighthouse-gate
      - zap-baseline
      - db
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every release proof
        env:
          BUILD_RESULT: ${{ needs.build-gate.result }}
          E2E_RESULT: ${{ needs.e2e-gate.result }}
          A11Y_RESULT: ${{ needs.a11y-gate.result }}
          VISUAL_RESULT: ${{ needs.visual-gate.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse-gate.result }}
          ZAP_RESULT: ${{ needs.zap-baseline.result }}
          DB_RESULT: ${{ needs.db.result }}
        run: |
          test "$BUILD_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$A11Y_RESULT" = "success"
          test "$VISUAL_RESULT" = "success"
          test "$LIGHTHOUSE_RESULT" = "success"
          test "$ZAP_RESULT" = "success"
          test "$DB_RESULT" = "success"
