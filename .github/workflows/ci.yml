name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_GROWTH_ANNUAL_PRICE_ID: price_annual_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      RESEND_FROM: Nabaperks CI <ci@example.test>
      CRON_SECRET: 'N7!qL2@vR9#cT4$yH6^mK8&pD3*zF5?x'
      PRODUCTION_MONITOR_SECRET: 'P4@wS8#nC2!kV6$rJ9^tB3&yM7*zQ5?e'
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: 'H9!mD4@qL7#vR2$tK8^xC5&pN3*zW6?g'
      CUSTOMER_PHONE_HMAC_SECRET: 'Q6!rF3@wM8#kT2$yP9^cD4&vL7*zN5?h'
      CUSTOMER_PHONE_ENCRYPTION_KEY: 'V2!pK7@mR4#xH9$cF3^nQ8&wT5*zD6?j'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Configure non-secret CI VAPID fixture
        run: node scripts/generate-ci-vapid-env.mjs >> "$GITHUB_ENV"
      - name: Configure non-secret CI auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec VTghZE0zQGtSNyN2SDIkY1E5XnBMNSZ3RjQqek42P3g= >> "$GITHUB_ENV"
      - run: pnpm env:check:production
      - run: pnpm security:audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm tokens:check
      - run: pnpm claims:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:check
      - run: pnpm jsonld:check

  db:
    name: DB behavioral moat
    runs-on: ubuntu-latest
    env:
      SUPABASE_SEND_EMAIL_HOOK_URI: http://host.docker.internal:3147/api/auth/hooks/send-email
      SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - name: Configure local auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec dGVzdF9zdXBhYmFzZV9ob29rX3NlY3JldF8zMl9ieXRlcw== >> "$GITHUB_ENV"
      - run: supabase start
      - run: pnpm db:seed
      - run: pnpm test:db
      - run: supabase stop --no-backup
        if: always()
