name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_GROWTH_ANNUAL_PRICE_ID: price_annual_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      RESEND_FROM: Nabaperks CI <ci@example.test>
      CRON_SECRET: "N7!qL2@vR9#cT4$yH6^mK8&pD3*zF5?x"
      PRODUCTION_MONITOR_SECRET: "P4@wS8#nC2!kV6$rJ9^tB3&yM7*zQ5?e"
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: "H9!mD4@qL7#vR2$tK8^xC5&pN3*zW6?g"
      CUSTOMER_PHONE_HMAC_SECRET: "Q6!rF3@wM8#kT2$yP9^cD4&vL7*zN5?h"
      CUSTOMER_PHONE_ENCRYPTION_KEY: "V2!pK7@mR4#xH9$cF3^nQ8&wT5*zD6?j"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Configure non-secret CI VAPID fixture
        run: node scripts/generate-ci-vapid-env.mjs >> "$GITHUB_ENV"
      - name: Configure non-secret CI auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec VTghZE0zQGtSNyN2SDIkY1E5XnBMNSZ3RjQqek42P3g= >> "$GITHUB_ENV"
      - run: pnpm env:check:production
      - run: pnpm security:audit --ignore-registry-errors
      # Keep the component checks visible to existing policy contracts; together
      # they are the hosted equivalent of `pnpm quality:check`.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm deadcode:check
      - run: pnpm duplicates:check
      - run: pnpm debt:check
      - run: pnpm flags:check
      - run: pnpm docs:check
      - run: pnpm agents:check
      - run: pnpm tokens:check
      - run: pnpm claims:check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm bundle:check
      - run: pnpm jsonld:check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.project }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari, desktop-firefox, desktop-safari]
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      PLAYWRIGHT_WORKERS: "1"
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install project browser
        run: |
          case "${{ matrix.project }}" in
            chromium) browser=chromium ;;
            desktop-firefox) browser=firefox ;;
            mobile-safari|desktop-safari) browser=webkit ;;
          esac
          pnpm exec playwright install --with-deps "$browser"
      - run: pnpm test:e2e -- --project="${{ matrix.project }}" --grep-invert @visual --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-gate:
    name: E2E (DB-free harness tier)
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser shard
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$E2E_RESULT" = "success"

  a11y:
    name: Accessibility (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari]
    env:
      PLAYWRIGHT_WORKERS: "1"
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install project browser
        run: |
          case "${{ matrix.project }}" in
            chromium) browser=chromium ;;
            mobile-safari) browser=webkit ;;
          esac
          pnpm exec playwright install --with-deps "$browser"
      - run: pnpm test:a11y -- --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: a11y-playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  a11y-gate:
    name: Accessibility sweep
    needs: a11y
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every accessibility project
        env:
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: test "$A11Y_RESULT" = "success"

  visual:
    name: Visual regression (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari]
    env:
      PLAYWRIGHT_WORKERS: "1"
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install project browser
        run: |
          case "${{ matrix.project }}" in
            chromium) browser=chromium ;;
            mobile-safari) browser=webkit ;;
          esac
          pnpm exec playwright install --with-deps "$browser"
      - run: pnpm test:visual -- --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: visual-playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-gate:
    name: Visual regression
    needs: visual
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every visual project
        env:
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: test "$VISUAL_RESULT" = "success"

  lighthouse:
    name: Lighthouse (${{ matrix.route }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: home
            url: http://127.0.0.1:3130/
          - route: pricing
            url: http://127.0.0.1:3130/pricing
          - route: loyalty-for-pubs
            url: http://127.0.0.1:3130/loyalty-for-pubs
          - route: signup
            url: http://127.0.0.1:3130/signup
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lighthouse -- --collect.url="${{ matrix.url }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report-${{ matrix.route }}
          path: reports/lighthouse/
          retention-days: 7

  lighthouse-gate:
    name: Lighthouse CI
    needs: lighthouse
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every Lighthouse route
        env:
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: test "$LIGHTHOUSE_RESULT" = "success"

  zap-baseline:
    name: ZAP baseline
    needs: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: |
          pnpm start > /tmp/nabaperks-zap.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-zap.log
          exit 1
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false

  db:
    name: DB behavioral moat
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_SEND_EMAIL_HOOK_URI: http://host.docker.internal:3147/api/auth/hooks/send-email
      SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - name: Configure local auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec dGVzdF9zdXBhYmFzZV9ob29rX3NlY3JldF8zMl9ieXRlcw== >> "$GITHUB_ENV"
      - run: supabase start
      - run: pnpm db:seed
      - run: pnpm test:db
      - run: supabase stop --no-backup
        if: always()
