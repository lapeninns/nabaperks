name: CI
run-name: "CI head:${{ github.event.pull_request.head.sha || github.sha }} base:${{ github.event.pull_request.base.sha || github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseding a run is only ever right on a pull request, where the newer push
# replaces the older one as the thing under review. On a push to main it is a
# correctness bug, not a saving: cancelling discards the minutes already spent
# (cancelled runs burned 14% of all CI minutes across a 25-run sample) and can
# leave the superseded main commit with no successful CI run at all - and
# 'Release gate' evidence is required at an exact main revision, so a commit
# whose only run was cancelled cannot be released from without re-running CI.
#
# Turning cancellation off is not on its own enough to protect a main commit.
# Per docs/operations/production-runbook.md, "GitHub concurrency does not
# promise FIFO delivery: a newer pending run may replace an older pending
# run." With one shared group per ref, three rapid pushes to main leave run 1
# running, run 2 pending and run 3 displacing pending run 2, so the middle
# commit ends with no run at all. Keying the group by github.sha on a push
# gives every main commit a group of its own, so no push can displace another
# and every commit keeps its own evidence. Pull requests keep the shared
# per-ref group, where superseding the older run is the wanted behaviour.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Shared non-secret CI fixture. Every job inherits this baseline; jobs layer
# their own extras on top (the fast lane adds the strict production-profile
# values, browser tiers add the dev OTP code, the DB tier adds local Supabase
# wiring). Values are deliberate placeholders, never real credentials.
env:
  CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CI_HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
  NEXT_PUBLIC_APP_URL: https://example.test
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_LAUNCH_PRICE_ID: price_launch_ci
  STRIPE_GROWTH_PRICE_ID: price_ci
  STRIPE_GROWTH_ANNUAL_PRICE_ID: price_annual_ci
  STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
  RESEND_API_KEY: re_ci
  TWILIO_ACCOUNT_SID: ACci
  TWILIO_AUTH_TOKEN: ci-twilio-auth-token
  TWILIO_VERIFY_SERVICE_SID: VAci
  CUSTOMER_SESSION_SECRET: "H9!mD4@qL7#vR2$tK8^xC5&pN3*zW6?g"
  CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
  CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b

# The three lanes below are the hosted equivalent of `pnpm quality:check`,
# split so feedback fails fast: the fast lane gates every dev-server browser
# tier, the quality lane carries the hygiene sweeps, and the production
# bundle is built exactly once and shared with Lighthouse + ZAP as an
# artifact. The stable Release gate checks the reviewed impact plan; full and
# exact-main runs require all nine roots. Missing, skipped, cancelled or failed
# required lanes cannot approve a merge. The advisory local
# observation runs separately so it cannot hold the whole CI workflow open.
jobs:
  selection:
    name: Select required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      profile: ${{ steps.plan.outputs.profile }}
      comparison: ${{ steps.plan.outputs.comparison }}
    steps:
      # The PR cannot edit the classifier that judges its own scope. Read its
      # immutable merge tree using Git, while executing policy from main's base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the already reviewed policy tree
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git checkout --detach "$CI_BASE_SHA"
          fi
      - uses: ./.github/actions/setup
        if: ${{ hashFiles('scripts/ci/plan-checks.mjs') != '' }}
      - name: Classify the immutable candidate with reviewed policy
        id: plan
        run: |
          if [ -f scripts/ci/plan-checks.mjs ]; then
            node scripts/ci/plan-checks.mjs
          else
            # Initial installation has no classifier on the reviewed base.
            # It must pass the whole suite AND the new comparison before merge.
            node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const identity = {
            repository: process.env.GITHUB_REPOSITORY,
            event: process.env.GITHUB_EVENT_NAME,
            baseSha: process.env.CI_BASE_SHA,
            headSha: process.env.CI_HEAD_SHA,
            candidateSha: process.env.GITHUB_SHA,
          }
          const plan = {
            schema: 'nabaperks.ci-impact-plan.v1', identity, profile: 'full',
            reason: 'Policy bootstrap: full validation and selection comparison required',
            required: ['fast','quality','build','e2e','a11y','visual','lighthouse','zap-baseline','db'],
            pages: [], changes: [], comparisonRequired: true,
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `plan=${JSON.stringify(plan)}\nprofile=full\ncomparison=true\n`)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### CI selection\n\nFull validation: the reviewed base does not yet contain the impact policy. All nine workloads and selection comparison are required.\n')
          JS
          fi

  documentation:
    name: Documentation validation
    needs: selection
    if: ${{ needs.selection.outputs.profile == 'documentation' || (needs.selection.outputs.profile == 'public-pages' && contains(fromJSON(needs.selection.outputs.plan).required, 'documentation')) || needs.selection.outputs.comparison == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_IMPACT_PLAN: ${{ needs.selection.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node scripts/ci/run-targeted-checks.mjs documentation
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-documentation-evidence
          path: ${{ runner.temp }}/documentation-evidence/documentation.json
          if-no-files-found: error
          retention-days: 7

  targeted-browser:
    name: Affected page browser checks
    needs: selection
    if: ${{ needs.selection.outputs.profile == 'public-pages' || needs.selection.outputs.comparison == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host --user 1001
    timeout-minutes: 15
    env:
      CI_IMPACT_PLAN: ${{ needs.selection.outputs.plan }}
      PLAYWRIGHT_WORKERS: "1"
      PLAYWRIGHT_REGULAR_CHROMIUM: "1"
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: node scripts/ci/check-browser-image.mjs
      - run: |
          for project in chromium mobile-safari desktop-firefox desktop-safari; do
            node scripts/ci/run-targeted-checks.mjs browser "$project" "$RUNNER_TEMP/targeted-browser/$project"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: targeted-browser
          path: ${{ runner.temp }}/targeted-browser/
          if-no-files-found: error
          retention-days: 7

  targeted-visual:
    name: Affected page visual checks
    needs: [selection, fast]
    if: ${{ needs.selection.outputs.profile == 'public-pages' || needs.selection.outputs.comparison == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_IMPACT_PLAN: ${{ needs.selection.outputs.plan }}
      PLAYWRIGHT_WORKERS: "1"
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
        with:
          project: chromium
      - uses: ./.github/actions/playwright
        with:
          project: mobile-safari
      - run: |
          for project in chromium mobile-safari; do
            node scripts/ci/run-targeted-checks.mjs visual "$project" "$RUNNER_TEMP/targeted-visual/$project"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: targeted-visual
          path: ${{ runner.temp }}/targeted-visual/
          if-no-files-found: error
          retention-days: 7

  selection-comparison:
    name: Verify targeted and full outcomes
    needs:
      [
        selection,
        e2e,
        a11y,
        visual,
        documentation,
        targeted-browser,
        targeted-visual,
      ]
    if: ${{ always() && needs.selection.outputs.comparison == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_IMPACT_PLAN: ${{ needs.selection.outputs.plan }}
      CI_COMPARISON_NEEDS: ${{ toJSON(needs) }}
      CI_COMPARISON_CANDIDATE_TREE: ${{ github.workspace }}/comparison-candidate
    steps:
      - name: Check out reviewed comparison policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Select the immutable comparison verifier
        id: verifier
        env:
          REVIEWED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_REVISION"
          if [ -f scripts/ci/compare-targeted-evidence.mjs ]; then
            echo "revision=$REVIEWED_REVISION" >> "$GITHUB_OUTPUT"
            echo "source=reviewed-base" >> "$GITHUB_OUTPUT"
          else
            test "$GITHUB_EVENT_NAME" = pull_request
            test ! -f config/ci-impact-policy.json
            # This exact verifier received code-owner review before later PR
            # repairs. Its approval is not approval of the current PR head.
            echo "revision=1a50396145b2daf0aed9b8de2f4a0cd2db0542a2" >> "$GITHUB_OUTPUT"
            echo "source=reviewed-bootstrap" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the immutable verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.verifier.outputs.revision }}
          persist-credentials: false
      - name: Verify the comparison source revision
        env:
          VERIFIER_REVISION: ${{ steps.verifier.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIER_REVISION"
      - name: Bound bootstrap to the reviewed browser configuration
        if: ${{ steps.verifier.outputs.source == 'reviewed-bootstrap' }}
        env:
          VERIFIER_REVISION: ${{ steps.verifier.outputs.revision }}
          CANDIDATE_REVISION: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CANDIDATE_REVISION"
          git diff --exit-code "$VERIFIER_REVISION" "$CANDIDATE_REVISION" -- config/ci-impact-policy.json playwright.config.ts scripts/playwright-server-heap.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml .nvmrc .github/actions/setup .github/actions/playwright
      - uses: ./.github/actions/setup
      # Candidate checkout is data only. Dependencies and verifier still come
      # from the immutable reviewed checkout above.
      - name: Read the immutable candidate as Git data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: comparison-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-documentation-evidence
          path: ${{ runner.temp }}/documentation
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: playwright-report-*
          path: ${{ runner.temp }}/full-e2e
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-a11y-json-*
          path: ${{ runner.temp }}/full-a11y
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-visual-json-*
          path: ${{ runner.temp }}/full-visual
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: targeted-*
          path: ${{ runner.temp }}/targeted
      - run: node scripts/ci/compare-targeted-evidence.mjs "$RUNNER_TEMP"
      - name: Record the immutable verifier identity
        env:
          VERIFIER_REVISION: ${{ steps.verifier.outputs.revision }}
          VERIFIER_SOURCE: ${{ steps.verifier.outputs.source }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const path = join(process.env.RUNNER_TEMP, 'selection-comparison.json')
          const result = JSON.parse(readFileSync(path, 'utf8'))
          result.verifier = { revision: process.env.VERIFIER_REVISION, source: process.env.VERIFIER_SOURCE }
          writeFileSync(path, JSON.stringify(result, null, 2) + '\n')
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-selection-comparison
          path: ${{ runner.temp }}/selection-comparison.json
          if-no-files-found: error
          retention-days: 90

  fast:
    if: ${{ contains(fromJSON('["full","public-pages"]'), needs.selection.outputs.profile) }}
    needs: selection
    name: Fast lane (lint, typecheck, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEND_FROM: Nabaperks CI <ci@example.test>
      CRON_SECRET: "N7!qL2@vR9#cT4$yH6^mK8&pD3*zF5?x"
      PRODUCTION_MONITOR_SECRET: "P4@wS8#nC2!kV6$rJ9^tB3&yM7*zQ5?e"
      CUSTOMER_SESSION_SECRET: "H9!mD4@qL7#vR2$tK8^xC5&pN3*zW6?g"
      CUSTOMER_PHONE_HMAC_SECRET: "Q6!rF3@wM8#kT2$yP9^cD4&vL7*zN5?h"
      CUSTOMER_PHONE_ENCRYPTION_KEY: "V2!pK7@mR4#xH9$cF3^nQ8&wT5*zD6?j"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Configure non-secret CI VAPID fixture
        run: node scripts/generate-ci-vapid-env.mjs >> "$GITHUB_ENV"
      - name: Configure non-secret CI auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec VTghZE0zQGtSNyN2SDIkY1E5XnBMNSZ3RjQqek42P3g= >> "$GITHUB_ENV"
      - name: Run shared fast validation commands
        run: node scripts/ci/run-workload.mjs fast
      # Four tests in tests/unit/google-review-pdf.test.mjs render through a
      # real Chromium (google-review-pdf -> google-review-pdf-render ->
      # print-kit-browser -> chromium.launch()), so the unit tier needs a
      # browser just like the E2E tiers do. This has never been exercised here:
      # `security:audit` above has failed on every run since those tests landed,
      # short-circuiting the job before `test:coverage`.
      - name: Install Chromium for the browser-backed unit tests
        uses: ./.github/actions/playwright
        with:
          project: chromium
      # The unit suite runs exactly once, with coverage thresholds enforced.
      - run: node scripts/ci/run-workload.mjs coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  quality:
    if: ${{ contains(fromJSON('["full","public-pages"]'), needs.selection.outputs.profile) }}
    needs: selection
    name: Quality lane (hygiene sweeps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run shared quality validation commands
        run: node scripts/ci/run-workload.mjs quality
      # Keep the vector/pdf-lib poster geometry proof, then render the exact
      # Playwright production bundle (duplex posters, tents, cards and plates)
      # so the release gate cannot pass against a stand-in PDF path.
      - name: Install PDF QA tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick
          python3 -m pip install --quiet opencv-python-headless pymupdf
      - name: Install Chromium for production print-kit rendering
        uses: ./.github/actions/playwright
        with:
          project: chromium
      - name: Verify pdf-lib poster geometry
        run: pnpm posters:verify-pdfs
      - name: Verify production preview print-kit PDFs
        env:
          PRINT_KIT_PREVIEW_ORIGIN: http://127.0.0.1:3000
        run: |
          preview_log="$RUNNER_TEMP/print-kit-preview.log"
          pnpm exec next dev --webpack -H 127.0.0.1 > "$preview_log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..60}; do
            if curl --silent --fail \
              "$PRINT_KIT_PREVIEW_ORIGIN/dev/poster-preview?template=seal" \
              >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$preview_log"
            exit 1
          fi

          pnpm posters:verify-production-pdfs

  build:
    if: ${{ contains(fromJSON('["full","public-pages"]'), needs.selection.outputs.profile) }}
    needs: selection
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Run shared production build validation commands
        run: node scripts/ci/run-workload.mjs build
      - name: Share production bundle with Lighthouse and ZAP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: next-build
          include-hidden-files: true
          path: |
            .next
            !.next/cache
          retention-days: 1

  build-gate:
    name: Typecheck and build
    needs: [selection, fast, quality, build]
    if: ${{ always() && contains(fromJSON('["full","public-pages"]'), needs.selection.outputs.profile) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every lane
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$FAST_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"

  e2e:
    if: ${{ needs.selection.outputs.profile == 'full' }}
    needs: selection
    name: E2E (${{ matrix.project }}, pack ${{ matrix.pack }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host --user 1001
    # Bound the complete eight-shard pack, including fresh-server teardown.
    # Setup - checkout, ./.github/actions/setup, container pull and browser
    # verification - costs ~54s per job and is paid once per job however much
    # test work follows, so halving the job count removes half of that toll.
    # Replaying run 34290952137's real per-job timings through this grouping
    # models the slowest pack at ~376s (up from 239s), so 30 minutes still
    # leaves nearly a 5x margin. Note the trade: that ~376s is above the 369s
    # whole-run wall clock Lighthouse used to set, so the critical path moves
    # here and the run gets roughly 15s longer in exchange for ~22 saved
    # machine-minutes. See scripts/ci/run-browser-pack.mjs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari, desktop-firefox, desktop-safari]
        # Each pack retains eight original /32 shards with fresh servers. The
        # /32 denominator is untouched, so Playwright distributes tests exactly
        # as before; only the grouping into jobs is coarser (4 packs x 8 shards
        # = the same 32 shards, each run exactly once per project).
        pack: [1, 2, 3, 4]
    env:
      # The dev-server tier is single-worker on purpose: under two parallel
      # workers the webpack dev server intermittently 500s mid-suite
      # (`__webpack_modules__[moduleId] is not a function` on /signup/verify,
      # observed 2026-07-20), and failOnFlakyTests turns any recovery into a
      # red run. Wall-clock parallelism comes from sharding instead.
      PLAYWRIGHT_WORKERS: "1"
      # Regular Chromium avoids process-level SIGSEGV flakes from the separate
      # headless-shell binary. Visual CI intentionally retains that shell so
      # its approved pixel baselines keep one stable rendering engine.
      PLAYWRIGHT_REGULAR_CHROMIUM: "1"
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Verify prepared browser environment
        run: node scripts/ci/check-browser-image.mjs
      - run: node scripts/ci/run-browser-pack.mjs "${{ matrix.project }}" "${{ matrix.pack }}" "$RUNNER_TEMP/browser-pack"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/browser-pack/
          retention-days: 7

  e2e-gate:
    name: E2E (DB-free harness tier)
    needs: [selection, e2e]
    if: ${{ always() && needs.selection.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser shard
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$E2E_RESULT" = "success"

  a11y:
    if: ${{ needs.selection.outputs.profile == 'full' }}
    needs: selection
    name: Accessibility (${{ matrix.project }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host --user 1001
    # Replayed against run 34290952137's real per-shard timings, a quarter
    # shard models at ~148s including its ~51s of setup (up from 112s), so the
    # existing 20-minute bound still leaves well over a 5x margin and stays put.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari]
        # Four shards, not eight: the same union of accessibility specs split
        # more coarsely. Setup was 55% of this tier's machine-minutes, and it
        # is paid once per job, so a coarser split spends the minutes on tests.
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      PLAYWRIGHT_WORKERS: "1"
      PLAYWRIGHT_REGULAR_CHROMIUM: "1"
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Verify prepared browser environment
        run: node scripts/ci/check-browser-image.mjs
      - env:
          CI_BROWSER_JSON_REPORT: ${{ needs.selection.outputs.comparison == 'true' && format('{0}/full-a11y.json', runner.temp) || '' }}
        run: node scripts/ci/browser-workload.mjs hosted test:a11y --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: a11y-playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && needs.selection.outputs.comparison == 'true' }}
        with:
          name: ci-a11y-json-${{ matrix.project }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/full-a11y.json
          if-no-files-found: error
          retention-days: 7

  a11y-gate:
    name: Accessibility sweep
    needs: [selection, a11y]
    if: ${{ always() && needs.selection.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every accessibility project
        env:
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: test "$A11Y_RESULT" = "success"

  visual:
    if: ${{ needs.selection.outputs.profile == 'full' }}
    name: Visual regression (${{ matrix.project }}, shard ${{ matrix.shard }})
    needs: [selection, fast]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari]
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      # Pixel snapshots stay single-worker on purpose: parallel load shifts
      # paint timing and would destabilise the blessed baselines.
      PLAYWRIGHT_WORKERS: "1"
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Install project browser
        uses: ./.github/actions/playwright
        with:
          project: ${{ matrix.project }}
      - name: Run the unchanged visual selection
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/full-visual.json
          SELECTION_COMPARISON: ${{ needs.selection.outputs.comparison }}
        run: |
          if [ "$SELECTION_COMPARISON" = true ]; then
            pnpm test:visual -- --project="${{ matrix.project }}" --shard="${{ matrix.shard }}" --reporter=line,json,./scripts/ci/browser-configuration-reporter.mjs
          else
            pnpm test:visual -- --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: visual-playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && needs.selection.outputs.comparison == 'true' }}
        with:
          name: ci-visual-json-${{ matrix.project }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/full-visual.json
          if-no-files-found: error
          retention-days: 7

  visual-gate:
    name: Visual regression
    needs: [selection, visual]
    if: ${{ always() && needs.selection.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every visual project
        env:
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: test "$VISUAL_RESULT" = "success"

  lighthouse:
    if: ${{ needs.selection.outputs.profile == 'full' }}
    name: Lighthouse (${{ matrix.route }})
    needs: [selection, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - route: home
            url: http://127.0.0.1:3130/
          - route: pricing
            url: http://127.0.0.1:3130/pricing
          - route: loyalty-for-pubs
            url: http://127.0.0.1:3130/loyalty-for-pubs
          - route: signup
            url: http://127.0.0.1:3130/signup
    env:
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Reuse the production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: next-build
          path: .next
      - run: pnpm lighthouse -- --collect.url="${{ matrix.url }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report-${{ matrix.route }}
          path: reports/lighthouse/
          retention-days: 7

  lighthouse-gate:
    name: Lighthouse CI
    needs: [selection, lighthouse]
    if: ${{ always() && needs.selection.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every Lighthouse route
        env:
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: test "$LIGHTHOUSE_RESULT" = "success"

  zap-baseline:
    if: ${{ needs.selection.outputs.profile == 'full' }}
    name: ZAP baseline
    needs: [selection, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Reuse the production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: next-build
          path: .next
      - run: |
          pnpm start > /tmp/nabaperks-zap.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-zap.log
          exit 1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false

  db:
    if: ${{ needs.selection.outputs.profile == 'full' }}
    needs: selection
    name: DB behavioral moat
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_SEND_EMAIL_HOOK_URI: http://host.docker.internal:3147/api/auth/hooks/send-email
      SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.106.0
      - name: Configure local auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec dGVzdF9zdXBhYmFzZV9ob29rX3NlY3JldF8zMl9ieXRlcw== >> "$GITHUB_ENV"
      - run: supabase start
      - run: pnpm db:seed
      - run: pnpm test:db
      - run: supabase stop --no-backup
        if: always()

  db-gate:
    name: DB behavioral moat gate
    needs: [selection, db]
    if: ${{ always() && needs.selection.outputs.profile == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Stable required-check name so branch protection can block a merge when
      # the live Postgres/RLS/RPC moat is red. Mirrors e2e-gate/a11y-gate; the
      # `db` job also feeds the required Release gate. Keep this named rollup
      # for existing dashboards while the aggregate enforces its outcome.
      - name: Require the DB behavioral moat to pass
        env:
          DB_RESULT: ${{ needs.db.result }}
        run: test "$DB_RESULT" = "success"

  release-gate:
    name: Release gate
    needs:
      - fast
      - quality
      - build
      - e2e
      - a11y
      - visual
      - lighthouse
      - zap-baseline
      - db
      - selection
      - documentation
      - targeted-browser
      - targeted-visual
      - selection-comparison
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Allow cold checkout time without turning this short verdict into a wait.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Verify the required checks using reviewed policy
        env:
          CI_REQUIRED_EVIDENCE: ${{ toJSON(needs) }}
        run: |
          if [ -f scripts/ci/verify-impact-evidence.mjs ]; then
            node scripts/ci/verify-impact-evidence.mjs
          else
            # Bootstrap cannot reduce the old gate. Validate the old nine roots
            # with its reviewed verifier, plus all new qualification jobs.
            node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFileSync } from 'node:fs'
          import { verifyRequiredEvidence, REQUIRED_HOSTED_JOBS } from './scripts/ci/verify-required-evidence.mjs'
          const needs = JSON.parse(process.env.CI_REQUIRED_EVIDENCE)
          const extra = ['selection','documentation','targeted-browser','targeted-visual','selection-comparison']
          assert.deepEqual(Object.keys(needs).sort(), [...REQUIRED_HOSTED_JOBS, ...extra].sort())
          for (const name of extra) assert.equal(needs[name]?.result, 'success', `${name} must pass during bootstrap`)
          const plan = JSON.parse(needs.selection.outputs.plan)
          assert.equal(plan.profile, 'full')
          assert.equal(plan.comparisonRequired, true)
          assert.deepEqual(plan.identity, {
            repository: process.env.GITHUB_REPOSITORY, event: process.env.GITHUB_EVENT_NAME,
            baseSha: process.env.CI_BASE_SHA, headSha: process.env.CI_HEAD_SHA, candidateSha: process.env.GITHUB_SHA,
          })
          const result = verifyRequiredEvidence(Object.fromEntries(REQUIRED_HOSTED_JOBS.map(name => [name, needs[name]])))
          console.log(result)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Full bootstrap validation\n\n${result}\n\nTargeted/full comparison also passed. No required workload was omitted.\n`)
          JS
          fi
