name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so feedback stays fast.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Strict governance validation
        run: pnpm governance
      - name: PR declared blast-radius diff check
        if: github.event_name == 'pull_request'
        run: pnpm governance:blast-radius

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run unit tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 14
      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 14

  quality:
    name: Code health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Naming, debt, N+1, AGENTS.md, complexity, routes, dead/dup code
        run: pnpm quality

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Static security verification
        run: pnpm security:verify
      - name: Static migration / schema checks
        run: pnpm db:verify

  build:
    name: Build
    runs-on: ubuntu-latest
    # Placeholder values satisfy the env contract so the compile-time build runs
    # in CI. They are NOT secrets — real builds use Vercel project env vars.
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Production build
        run: pnpm build
      - name: Validate env contract
        run: pnpm env:check
      - name: Client bundle-size budget
        run: pnpm bundle:size
      - name: Dependency footprint report
        run: pnpm deps:analyze

  db-rls:
    name: SQL / RLS (local Supabase)
    runs-on: ubuntu-latest
    # Runs the SQL/RLS/atomicity tests against a disposable local Supabase stack
    # (Postgres + auth schema + anon/authenticated/service_role roles). A bare
    # Postgres image is insufficient because migrations depend on auth.uid()
    # and the Supabase-provisioned roles. The localhost guard in
    # run-supabase-sql.mjs ensures these writes never reach a hosted project.
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations, seed, and run RLS/atomicity SQL tests
        run: pnpm db:setup
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  e2e:
    name: E2E + visual + a11y (local Supabase)
    runs-on: ubuntu-latest
    # Drives the real app against a disposable local Supabase stack: customer
    # journey, screenshots/visual, PWA, design-system, and the axe accessibility
    # gate (qa:e2e runs every tests/e2e spec). Dev OTP bypass (424242) avoids
    # Twilio; Stripe/Resend use CI placeholders not exercised by the journey.
    env:
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      CUSTOMER_DEV_OTP_CODE: "424242"
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Export local Supabase keys to the job env
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
      - name: Apply migrations and seed demo data
        run: pnpm db:setup
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E, visual, and accessibility specs
        run: pnpm qa:e2e
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            test-results
            docs/screenshots
          retention-days: 14
