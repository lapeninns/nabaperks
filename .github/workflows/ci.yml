name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_GROWTH_ANNUAL_PRICE_ID: price_annual_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      RESEND_FROM: Nabaperks CI <ci@example.test>
      WEB_PUSH_VAPID_PUBLIC_KEY: ci-vapid-public-key
      WEB_PUSH_VAPID_PRIVATE_KEY: ci-vapid-private-key
      WEB_PUSH_VAPID_SUBJECT: mailto:ci@example.test
      CRON_SECRET: 'N7!qL2@vR9#cT4$yH6^mK8&pD3*zF5?x'
      PRODUCTION_MONITOR_SECRET: 'P4@wS8#nC2!kV6$rJ9^tB3&yM7*zQ5?e'
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: 'H9!mD4@qL7#vR2$tK8^xC5&pN3*zW6?g'
      CUSTOMER_PHONE_HMAC_SECRET: 'Q6!rF3@wM8#kT2$yP9^cD4&vL7*zN5?h'
      CUSTOMER_PHONE_ENCRYPTION_KEY: 'V2!pK7@mR4#xH9$cF3^nQ8&wT5*zD6?j'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Configure non-secret CI auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec VTghZE0zQGtSNyN2SDIkY1E5XnBMNSZ3RjQqek42P3g= >> "$GITHUB_ENV"
      - run: pnpm env:check:production
      - run: pnpm security:audit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm governance:check
      - run: pnpm e2e:install
      - run: pnpm governance:run-gates
      - run: pnpm tokens:check
      - run: pnpm claims:check
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm bundle:check
      - run: pnpm jsonld:check
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (DB-free harness tier)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm e2e:install
      - run: pnpm test:e2e -- --project=chromium --grep "poster printing"
      - run: pnpm test:e2e -- --project=chromium --grep-invert "@visual|poster printing"
      - run: pnpm test:e2e -- --project=mobile-safari --grep-invert @visual
      - run: pnpm test:e2e -- --project=desktop-firefox --grep-invert @visual
      - run: pnpm test:e2e -- --project=desktop-safari --grep-invert @visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  a11y:
    name: Accessibility sweep
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm e2e:install
      - run: pnpm test:a11y -- --project=chromium --project=mobile-safari
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: a11y-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm e2e:install
      - run: pnpm test:visual -- --project=chromium --project=mobile-safari
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: visual-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
      CUSTOMER_DEV_OTP_CODE: "424242"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: reports/lighthouse/
          retention-days: 7

  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_GROWTH_PRICE_ID: price_ci
      STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
      RESEND_API_KEY: re_ci
      TWILIO_ACCOUNT_SID: ACci
      TWILIO_AUTH_TOKEN: ci-twilio-auth-token
      TWILIO_VERIFY_SERVICE_SID: VAci
      CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
      CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
      CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: |
          pnpm start > /tmp/nabaperks-zap.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-zap.log
          exit 1
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false

  db:
    name: DB behavioral moat
    runs-on: ubuntu-latest
    env:
      SUPABASE_SEND_EMAIL_HOOK_URI: http://host.docker.internal:3147/api/auth/hooks/send-email
      SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - name: Configure local auth-hook fixture
        run: |
          printf 'SUPABASE_SEND_EMAIL_HOOK_SECRET=v1,%s_%s\n' whsec dGVzdF9zdXBhYmFzZV9ob29rX3NlY3JldF8zMl9ieXRlcw== >> "$GITHUB_ENV"
      - run: supabase start
      - run: pnpm db:seed
      - run: pnpm test:db
      - run: supabase stop --no-backup
        if: always()
