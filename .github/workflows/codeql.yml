name: CodeQL
run-name: "CodeQL head:${{ github.event.pull_request.head.sha || github.sha }} base:${{ github.event.pull_request.base.sha || github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

# Keyed the way ci.yml keys itself, and for the same reason: on a push the
# group is the commit, so a later push to main cannot cancel the run that is
# the earlier main commit's only CodeQL evidence - and `Analyze
# (javascript-typescript)` is a required check, so a cancelled run leaves that
# commit unable to satisfy the gate. Superseded pull-request work is still
# cancelled, which is the case cancellation is actually for.
concurrency:
  group: codeql-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"
