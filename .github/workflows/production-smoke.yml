name: Production smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  probes:
    name: Liveness and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCTION_MONITOR_SECRET: ${{ secrets.PRODUCTION_MONITOR_SECRET }}
    steps:
      - name: Verify public liveness
        run: |
          expected_revision="${GITHUB_SHA:0:12}"
          body="$(curl --fail --silent --show-error --max-time 10 https://nabaperks.com/api/health)"
          jq -e --arg revision "$expected_revision" '.status == "ok" and .scope == "liveness" and .service == "nabaperks" and (.time | type == "string" and test("^\\d{4}-\\d{2}-\\d{2}T")) and .revision == $revision and .environment == "production"' <<<"$body"
      - name: Verify dependency readiness
        run: |
          expected_revision="${GITHUB_SHA:0:12}"
          body="$(curl --fail --silent --show-error --max-time 10 --header "Authorization: Bearer ${PRODUCTION_MONITOR_SECRET}" https://nabaperks.com/api/readiness)"
          jq -e --arg revision "$expected_revision" '.status == "ready" and .checks.database == "ok" and .service == "nabaperks" and (.time | type == "string" and test("^\\d{4}-\\d{2}-\\d{2}T")) and .revision == $revision and .environment == "production"' <<<"$body"
