name: Agent watchdog

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: agent-watchdog
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Agent heartbeat freshness
    if: ${{ vars.LOCAL_CI_WATCHDOG_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Require a heartbeat from the pinned App within 20 minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-agent-liveness.mjs

  public-health:
    name: Public health watchdog
    if: ${{ vars.LOCAL_CI_WATCHDOG_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Probe public production liveness
        run: |
          body="$(curl --fail --silent --show-error --max-time 10 https://nabaperks.com/api/health)"
          jq -e '.status == "ok" and .scope == "liveness" and .service == "nabaperks" and .environment == "production" and .targetEnvironment == "production"' <<<"$body"
