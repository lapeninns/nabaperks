name: Delivery decision report

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI, CodeQL, Production database promotion]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

# Pull-request-triggered reports are grouped per pull request. All
# workflow_run and dispatch reports share one group per event type and still
# supersede each other, which is acceptable because the report is one global
# delivery summary where only the newest matters.
concurrency:
  group: delivery-decision-report-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Metadata-only inspection. Never check out the triggering PR/run, execute
      # candidate code, install dependencies or download candidate artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Explain the next delivery decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/factory-status.mjs --summary
