name: Nightly QA hardening

on:
  schedule:
    - cron: "24 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: https://example.test
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_GROWTH_PRICE_ID: price_ci
  STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
  RESEND_API_KEY: re_ci
  TWILIO_ACCOUNT_SID: ACci
  TWILIO_AUTH_TOKEN: ci-twilio-auth-token
  TWILIO_VERIFY_SERVICE_SID: VAci
  CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
  CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
  CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
  CUSTOMER_DEV_OTP_CODE: "424242"

jobs:
  cross-browser:
    name: Full cross-browser Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm e2e:install
      - run: pnpm test:e2e -- --project=chromium --project=mobile-safari --project=desktop-firefox --project=desktop-safari --grep-invert @visual
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: nightly-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm mutation:check
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 7

  load:
    name: k6 load checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: grafana/setup-k6-action@v1
      - run: pnpm build
      - run: pnpm start > /tmp/nabaperks-k6.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-k6.log
          exit 1
      - run: k6 run tests/load/public-routes.js
        env:
          BASE_URL: http://127.0.0.1:3000
      - run: k6 run tests/load/stamp-redeem-race.js
        if: ${{ vars.STAMP_RACE_URL != '' && vars.REDEEM_RACE_URL != '' }}
        env:
          STAMP_RACE_URL: ${{ vars.STAMP_RACE_URL }}
          REDEEM_RACE_URL: ${{ vars.REDEEM_RACE_URL }}
          STAMP_RACE_AUTH_TOKEN: ${{ secrets.STAMP_RACE_AUTH_TOKEN }}
          STAMP_RACE_BODY: ${{ vars.STAMP_RACE_BODY }}
          REDEEM_RACE_BODY: ${{ vars.REDEEM_RACE_BODY }}

  zap-full:
    name: ZAP full scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm start > /tmp/nabaperks-zap-full.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-zap-full.log
          exit 1
      - uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
