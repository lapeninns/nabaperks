name: Nightly QA hardening

on:
  schedule:
    - cron: "24 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: https://example.test
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_LAUNCH_PRICE_ID: price_launch_ci
  STRIPE_GROWTH_PRICE_ID: price_ci
  STRIPE_GROWTH_ANNUAL_PRICE_ID: price_annual_ci
  STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
  RESEND_API_KEY: re_ci
  TWILIO_ACCOUNT_SID: ACci
  TWILIO_AUTH_TOKEN: ci-twilio-auth-token
  TWILIO_VERIFY_SERVICE_SID: VAci
  CUSTOMER_SESSION_SECRET: ci-session-secret-placeholder
  CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
  CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
  CUSTOMER_DEV_OTP_CODE: "424242"

jobs:
  cross-browser:
    name: Full cross-browser Playwright (${{ matrix.project }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari, desktop-firefox, desktop-safari]
        # Sharded for memory, not speed. Run unsharded, the webpack dev server
        # accumulates heap across the whole suite and dies mid-run with
        # "FATAL ERROR: Ineffective mark-compacts near heap limit - JavaScript
        # heap out of memory"; every later navigation then fails with
        # ERR_CONNECTION_REFUSED (run 30196429475: chromium 13 failed / 141
        # passed, all in tent-print.desktop). Each shard gets its own runner and
        # its own fresh dev server, which is how the CI e2e tier already avoids
        # this.
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Install project browser
        uses: ./.github/actions/playwright
        with:
          project: ${{ matrix.project }}
      - run: pnpm test:e2e -- --project="${{ matrix.project }}" --grep-invert @visual --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: nightly-playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  cross-browser-gate:
    name: Full cross-browser Playwright
    needs: cross-browser
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser project
        env:
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
        run: test "$CROSS_BROWSER_RESULT" = "success"

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Stryker's `command` runner only supports coverageAnalysis: "off", so the
    # whole 798-test unit suite re-runs for every mutant across the 8 files in
    # stryker.conf.json. That has been sitting on the old 60-minute ceiling for
    # weeks (60m04s, 59m18s, 60m18s, 60m18s on main across 07-23..07-26) and
    # tipped from pass to timeout on 07-25. Raised so the job reports a real
    # mutation score instead of a timeout; if it creeps back, shrink `mutate`
    # rather than raising this again.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # Stryker replays the unit suite as its initial test run, and four tests
      # in tests/unit/google-review-pdf.test.mjs render through a real Chromium
      # (google-review-pdf -> google-review-pdf-render -> print-kit-browser ->
      # chromium.launch()). Without a browser those four fail and Stryker aborts
      # with "There were failed tests in the initial test run" before mutating.
      - name: Install Chromium for the browser-backed unit tests
        uses: ./.github/actions/playwright
        with:
          project: chromium
      - run: pnpm mutation:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 30

  load:
    name: k6 load checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1
      - run: pnpm build
      - run: pnpm start > /tmp/nabaperks-k6.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-k6.log
          exit 1
      - run: k6 run --summary-export=reports/k6-public-routes-summary.json tests/load/public-routes.js
        env:
          BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: k6-public-routes-summary
          path: reports/k6-public-routes-summary.json
          retention-days: 30

  load-race:
    name: Authenticated stamp and redeem race checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1
      - name: Require authenticated race targets
        env:
          STAMP_RACE_URL: ${{ vars.STAMP_RACE_URL }}
          REDEEM_RACE_URL: ${{ vars.REDEEM_RACE_URL }}
        run: |
          test -n "$STAMP_RACE_URL"
          test -n "$REDEEM_RACE_URL"
      - name: Run authenticated race check
        run: k6 run --summary-export=reports/k6-stamp-redeem-race-summary.json tests/load/stamp-redeem-race.js
        env:
          STAMP_RACE_URL: ${{ vars.STAMP_RACE_URL }}
          REDEEM_RACE_URL: ${{ vars.REDEEM_RACE_URL }}
          STAMP_RACE_AUTH_TOKEN: ${{ secrets.STAMP_RACE_AUTH_TOKEN }}
          STAMP_RACE_BODY: ${{ vars.STAMP_RACE_BODY }}
          REDEEM_RACE_BODY: ${{ vars.REDEEM_RACE_BODY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: k6-stamp-redeem-race-summary
          path: reports/k6-stamp-redeem-race-summary.json
          retention-days: 30

  zap-full:
    name: ZAP full scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm start > /tmp/nabaperks-zap-full.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-zap-full.log
          exit 1
      - uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
      - name: Retain ZAP full-scan reports and server log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report_html.html
            report_json.json
            report_md.md
            /tmp/nabaperks-zap-full.log
          if-no-files-found: warn
          retention-days: 30

  nightly-gate:
    name: Nightly QA gate
    needs:
      - cross-browser-gate
      - mutation
      - load
      - load-race
      - zap-full
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record exact-revision nightly receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_ID: ${{ github.job }}
          COMMIT_SHA: ${{ github.sha }}
          ARTIFACT_NAME: nightly-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          CONCLUSIONS: ${{ toJSON(needs) }}
        run: |
          jq -n \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            --arg workflow "$WORKFLOW" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg job "$JOB_ID" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg artifact "$ARTIFACT_NAME" \
            --argjson conclusions "$CONCLUSIONS" \
            '{run: $run_id, run_attempt: $run_attempt, workflow: $workflow, workflow_ref: $workflow_ref, job: $job, commit: $commit_sha, artifact: $artifact, conclusions: $conclusions}' \
            > nightly-receipt.json
      - name: Require every nightly prerequisite
        env:
          CROSS_BROWSER_RESULT: ${{ needs['cross-browser-gate'].result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          LOAD_RESULT: ${{ needs.load.result }}
          LOAD_RACE_RESULT: ${{ needs['load-race'].result }}
          ZAP_RESULT: ${{ needs['zap-full'].result }}
        run: |
          for result in \
            "$CROSS_BROWSER_RESULT" "$MUTATION_RESULT" "$LOAD_RESULT" \
            "$LOAD_RACE_RESULT" "$ZAP_RESULT"; do
            test "$result" = "success"
          done
      - name: Retain exact-revision nightly receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-receipt.json
          retention-days: 30
