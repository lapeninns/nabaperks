name: Nightly QA hardening

on:
  schedule:
    # Every night except Monday: cross-browser, k6 load and the ZAP full scan.
    - cron: "24 2 * * 0,2-6"
    # Monday: the same jobs plus weekly mutation testing. The two schedules
    # never fire together, so neither run cancels the other.
    - cron: "24 2 * * 1"
  workflow_dispatch:

concurrency:
  group: nightly-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: https://example.test
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_LAUNCH_PRICE_ID: price_launch_ci
  STRIPE_GROWTH_PRICE_ID: price_ci
  STRIPE_GROWTH_ANNUAL_PRICE_ID: price_annual_ci
  STRIPE_WEBHOOK_SECRET: ci_test_webhook_secret
  RESEND_API_KEY: re_ci
  TWILIO_ACCOUNT_SID: ACci
  TWILIO_AUTH_TOKEN: ci-twilio-auth-token
  TWILIO_VERIFY_SERVICE_SID: VAci
  CUSTOMER_SESSION_SECRET: "H9!mD4@qL7#vR2$tK8^xC5&pN3*zW6?g"
  CUSTOMER_PHONE_HMAC_SECRET: ci-hmac-secret-placeholder
  CUSTOMER_PHONE_ENCRYPTION_KEY: ci-encryption-key-placeholder-32b
  CUSTOMER_DEV_OTP_CODE: "424242"

jobs:
  cross-browser:
    name: Full cross-browser Playwright (${{ matrix.project }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari, desktop-firefox, desktop-safari]
        # Sharded for memory, not speed. Run unsharded, the webpack dev server
        # accumulates heap across the whole suite and dies mid-run with
        # "FATAL ERROR: Ineffective mark-compacts near heap limit - JavaScript
        # heap out of memory"; every later navigation then fails with
        # ERR_CONNECTION_REFUSED (run 30196429475: chromium 13 failed / 141
        # passed, all in tent-print.desktop). Each shard gets its own runner and
        # its own fresh dev server, which is how the CI e2e tier already avoids
        # this. Sixteen shards per project, down from 32, halve the fixed
        # per-shard setup cost and double each shard's share of the suite (and
        # so its dev-server heap growth); every shard still gets its own fresh
        # runner and dev server.
        shard:
          [
            1/16,
            2/16,
            3/16,
            4/16,
            5/16,
            6/16,
            7/16,
            8/16,
            9/16,
            10/16,
            11/16,
            12/16,
            13/16,
            14/16,
            15/16,
            16/16,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install project browser
        uses: ./.github/actions/playwright
        with:
          project: ${{ matrix.project }}
      - run: pnpm test:e2e -- --project="${{ matrix.project }}" --grep-invert @visual --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: nightly-playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cross-browser-gate:
    name: Full cross-browser Playwright
    needs: cross-browser
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every browser project
        env:
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
        run: test "$CROSS_BROWSER_RESULT" = "success"

  mutation:
    name: Mutation testing
    # Weekly: Monday's scheduled run and any manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '24 2 * * 1' }}
    runs-on: ubuntu-latest
    # The command runner checks the mutation targets' direct tests first and
    # runs the complete unit suite for every survivor. An already detected
    # mutant exits early instead of repeating unrelated browser-backed tests.
    # Preserve the eight-file scope and the existing 90-minute job ceiling.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Stryker replays the unit suite as its initial test run, and four tests
      # in tests/unit/google-review-pdf.test.mjs render through a real Chromium
      # (google-review-pdf -> google-review-pdf-render -> print-kit-browser ->
      # chromium.launch()). Without a browser those four fail and Stryker aborts
      # with "There were failed tests in the initial test run" before mutating.
      - name: Install Chromium for the browser-backed unit tests
        uses: ./.github/actions/playwright
        with:
          project: chromium
      - run: pnpm mutation:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 7

  load:
    name: k6 load checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1
      - run: pnpm build
      - run: pnpm start > /tmp/nabaperks-k6.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-k6.log
          exit 1
      - run: k6 run tests/load/public-routes.js
        env:
          BASE_URL: http://127.0.0.1:3000

  zap-full:
    name: ZAP full scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm start > /tmp/nabaperks-zap-full.log 2>&1 &
      - run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/nabaperks-zap-full.log
          exit 1
      # Advisory: without fail_action this job proves the scan ran, not that it
      # found nothing. The blocking policy lives in the required zap-baseline
      # root. Pinned image for the same reason as ci.yml.
      - uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: http://127.0.0.1:3000
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          # Load the policy explicitly (the action adds -c only for IGNORE lines).
          cmd_options: -c .zap/rules.tsv
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false

  notify:
    name: Reconcile nightly incident
    # The gate stands in for the whole shard matrix. always() still runs this
    # job after a failed need or mutation's weekly skip, handled below.
    needs: [cross-browser-gate, mutation, load, zap-full]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The only write grant in this workflow: open one standing issue on
    # failure and close it on recovery. Observation jobs stay contents: read.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Open once on failure and close on recovery
        # A run superseded by a newer one is cancelled, which observes nothing.
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          NIGHTLY_HEALTHY: ${{ needs.cross-browser-gate.result == 'success' && needs.load.result == 'success' && needs.zap-full.result == 'success' }}
          # Mutation is skipped outside Monday's run and dispatches. A skipped
          # job is not an observation, so it reaches the reconciler as null.
          MUTATION_MONITORED: ${{ needs.mutation.result != 'skipped' }}
          MUTATION_HEALTHY: ${{ needs.mutation.result == 'success' }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { readFileSync } = await import('node:fs');
            const { reconcileWatchdogIncidents } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/watchdog-incidents.mjs`).href);
            const contract = JSON.parse(readFileSync('config/local-ci-contract.json', 'utf8'));
            const results = await reconcileWatchdogIncidents({
              github, repository: context.repo,
              healthy: {
                heartbeat: null,
                publicHealth: null,
                nightly: process.env.NIGHTLY_HEALTHY === 'true',
                mutation: process.env.MUTATION_MONITORED === 'true' ? process.env.MUTATION_HEALTHY === 'true' : null,
              },
              runUrl: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              assignee: contract.agentLiveness.notificationAssignee,
            });
            await core.summary.addHeading('Nightly incident reconciliation')
              .addTable([['Monitor', 'Observed state', 'Incident action'], ...results.map(row => [row.monitor, row.state, `${row.action}${row.issue ? ` (#${row.issue})` : ''}`])]).write();
