name: DAST (ZAP baseline)

# Dynamic application security testing against a running deployment. Point it at
# a preview or production URL (workflow input, or the DAST_TARGET_URL repo
# variable). Advisory by default — it uploads an HTML report and does not fail
# the run — because it scans a live environment this workflow does not control.
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Base URL to scan (defaults to the DAST_TARGET_URL repo variable)
        required: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        run: |
          URL="${{ github.event.inputs.target_url || vars.DAST_TARGET_URL }}"
          if [ -z "$URL" ]; then
            echo "No target URL configured (set the DAST_TARGET_URL repo variable). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi
      - name: ZAP baseline scan
        if: steps.target.outputs.skip != 'true'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.target.outputs.url }}
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a -I"
