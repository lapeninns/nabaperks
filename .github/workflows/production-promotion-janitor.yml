name: Production promotion janitor

# Release evidence expires after one hour (scripts/release/manifest.mjs), so a
# Production approval that waits longer can never pass. Approval waiting time
# does not count against timeout-minutes because the gated job has not started
# on a runner, yet the run keeps the production-release concurrency slot. This
# janitor rejects such stale gates, falling back to cancelling the run.
on:
  schedule:
    - cron: "9/15 * * * *"
  workflow_dispatch:

concurrency:
  group: production-promotion-janitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  janitor:
    name: Release stale Production approval waits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: write cancels a stale run (fallback); deployments: write rejects
    # its pending Production deployment with the required review comment.
    permissions:
      contents: read
      actions: write
      deployments: write
    steps:
      - name: Check out the janitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Reject or cancel Production approvals past evidence expiry
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/promotion-janitor.mjs
