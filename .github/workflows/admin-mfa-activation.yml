name: Activate production admin MFA

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Full Git SHA currently at the tip of main
        required: true
        type: string
      admin_user_id:
        description: Independently verified active admin user UUID
        required: true
        type: string
      factor_id:
        description: Independently verified sole TOTP factor UUID
        required: true
        type: string
      confirmation:
        description: Type ACTIVATE_VERIFIED_ADMIN_MFA to continue
        required: true
        type: string

concurrency:
  group: production-admin-mfa-activation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  activate:
    name: Activate independently verified admin MFA
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      ADMIN_USER_ID: ${{ inputs.admin_user_id }}
      FACTOR_ID: ${{ inputs.factor_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_revision }}
          fetch-depth: 0
      - name: Verify immutable source, protected target and explicit intent
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse origin/main)" = "$EXPECTED_REVISION"
          test "$CONFIRMATION" = "ACTIVATE_VERIFIED_ADMIN_MFA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          uuid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          [[ "$ADMIN_USER_ID" =~ $uuid_pattern ]]
          [[ "$FACTOR_ID" =~ $uuid_pattern ]]
      - name: Invoke the audited service-role activation boundary
        run: |
          query="with trusted_context as materialized (select set_config('request.jwt.claim.role', 'service_role', true)) select public.activate_internal_admin_mfa(\$1::uuid, \$2::uuid) as activated from trusted_context"
          payload="$(jq -n \
            --arg query "$query" \
            --arg admin_user_id "$ADMIN_USER_ID" \
            --arg factor_id "$FACTOR_ID" \
            '{query: $query, parameters: [$admin_user_id, $factor_id], read_only: false}')"
          response_file="$RUNNER_TEMP/admin-mfa-activation-response.json"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query")"
          test "$status" = "201"
          jq -e 'type == "array" and length == 1 and .[0].activated == true' \
            "$response_file" >/dev/null
      - name: Record non-secret activation evidence
        run: |
          {
            echo "### Production admin MFA activation"
            echo
            echo "- Revision: \`$EXPECTED_REVISION\`"
            echo "- Independently verified sole TOTP factor: activated"
            echo "- Audited database boundary: passed"
            echo "- No user or factor identifier is included in this summary"
          } >> "$GITHUB_STEP_SUMMARY"
