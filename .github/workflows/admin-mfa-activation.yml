name: Activate production admin MFA

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Full Git SHA currently at the tip of main
        required: true
        type: string
      admin_user_id:
        description: Independently verified active admin user UUID
        required: true
        type: string
      credential_id:
        description: Independently verified application WebAuthn credential UUID
        required: true
        type: string
      confirmation:
        description: Type ACTIVATE_VERIFIED_ADMIN_MFA to continue
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Human decision point. `Production` holds credentials only; this
  # secret-free environment carries the required reviewer. The privileged job
  # below refuses an approval from another run attempt.
  approval:
    name: Approve admin MFA activation
    environment: Production approval
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      revision: ${{ steps.approved.outputs.revision }}
      run_attempt: ${{ steps.approved.outputs.run_attempt }}
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Record the approved revision and run attempt
        id: approved
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          echo "Approved admin MFA activation for $EXPECTED_REVISION (run $GITHUB_RUN_ID, attempt $RUN_ATTEMPT)."
          printf 'revision=%s\nrun_attempt=%s\n' "$EXPECTED_REVISION" "$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  activate:
    name: Activate independently verified admin MFA
    needs: approval
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      APPROVED_REVISION: ${{ needs.approval.outputs.revision }}
      APPROVED_RUN_ATTEMPT: ${{ needs.approval.outputs.run_attempt }}
      ADMIN_USER_ID: ${{ inputs.admin_user_id }}
      CREDENTIAL_ID: ${{ inputs.credential_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Require the approval from this run attempt
        run: |
          if [[ "$APPROVED_REVISION" != "$EXPECTED_REVISION" || "$APPROVED_RUN_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo "::error::Production approval does not cover revision $EXPECTED_REVISION in attempt $GITHUB_RUN_ATTEMPT. Dispatch a fresh run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source, protected target and explicit intent
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse origin/main)" = "$EXPECTED_REVISION"
          test "$CONFIRMATION" = "ACTIVATE_VERIFIED_ADMIN_MFA"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          uuid_pattern='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          [[ "$ADMIN_USER_ID" =~ $uuid_pattern ]]
          [[ "$CREDENTIAL_ID" =~ $uuid_pattern ]]
      - name: Invoke the audited service-role activation boundary
        run: |
          query="with trusted_context as materialized (select set_config('request.jwt.claim.role', 'service_role', true)) select public.activate_internal_admin_mfa(\$1::uuid, \$2::uuid) as activated from trusted_context"
          payload="$(jq -n \
            --arg query "$query" \
            --arg admin_user_id "$ADMIN_USER_ID" \
            --arg credential_id "$CREDENTIAL_ID" \
            '{query: $query, parameters: [$admin_user_id, $credential_id], read_only: false}')"
          response_file="$RUNNER_TEMP/admin-mfa-activation-response.json"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query")"
          test "$status" = "201"
          jq -e 'type == "array" and length == 1 and .[0].activated == true' \
            "$response_file" >/dev/null
      - name: Record non-secret activation evidence
        run: |
          {
            echo "### Production admin MFA activation"
            echo
            echo "- Revision: \`$EXPECTED_REVISION\`"
            echo "- Independently verified sole WebAuthn credential: activated"
            echo "- Audited database boundary: passed"
            echo "- No user or factor identifier is included in this summary"
          } >> "$GITHUB_STEP_SUMMARY"
