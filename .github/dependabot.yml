version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Release-age policy: let new releases bake before Dependabot proposes them,
    # longer for higher-risk bumps. Guards against pulling in a just-published
    # version that gets yanked or hot-fixed.
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
