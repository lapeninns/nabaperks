name: Install Playwright browser
description: >-
  Install the Playwright browser for one test project, restoring the browser
  bundle from a cache keyed on the installed @playwright/test version so the
  twenty browser jobs per run stop re-downloading identical binaries.

inputs:
  project:
    description: Playwright project name (chromium, desktop-firefox, mobile-safari, desktop-safari).
    required: true

runs:
  using: composite
  steps:
    - name: Resolve browser and Playwright version
      id: resolve
      shell: bash
      run: |
        case "${{ inputs.project }}" in
          chromium) browser=chromium ;;
          desktop-firefox) browser=firefox ;;
          mobile-safari|desktop-safari) browser=webkit ;;
          *) echo "Unknown Playwright project: ${{ inputs.project }}" >&2; exit 1 ;;
        esac
        version="$(node -p "require('@playwright/test/package.json').version")"
        echo "browser=$browser" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Restore browser cache
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.resolve.outputs.browser }}-${{ steps.resolve.outputs.version }}

    - name: Install browser with system dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps "${{ steps.resolve.outputs.browser }}"

    - name: Install system dependencies for cached browser
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm exec playwright install-deps "${{ steps.resolve.outputs.browser }}"
