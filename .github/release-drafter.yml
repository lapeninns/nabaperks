name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Customer experience"
    labels: ["area: customer"]
  - title: "Merchant console"
    labels: ["area: merchant"]
  - title: "Admin & operations"
    labels: ["area: admin"]
  - title: "Platform, data & security"
    labels: ["area: platform", "area: security", "area: database"]
  - title: "Tooling, CI & docs"
    labels: ["area: tooling", "area: ci", "area: docs"]
  - title: "Bug fixes"
    labels: ["type: bug"]
  - title: "Dependencies"
    labels: ["dependencies"]
version-resolver:
  major:
    labels: ["type: breaking"]
  minor:
    labels: ["type: feature"]
  patch:
    labels: ["type: bug", "type: chore", "dependencies"]
  default: patch
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
exclude-labels:
  - "skip-changelog"
template: |
  ## What changed

  $CHANGES

  **Full changelog**: https://github.com/lapeninns/nabaperks/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
