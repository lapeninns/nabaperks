<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Old Crown Girton — Google Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=DM+Sans:opsz,wght@9..40,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --google-blue:#1a73e8;
    --google-blue-deep:#1557b0;
    --gold:#fbbc04;
    --gold-deep:#e37400;
    --cream:#f7f1e8;
    --cream-line:#e5dccd;
    --ink:#1c1917;
    --ink-soft:#57534e;
    --ink-faint:#8a8074;
    --canvas:#f3ede3;
    --shadow-lg:0 2px 4px rgba(60,50,30,.08),0 10px 28px rgba(60,50,30,.16);
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"DM Sans",Roboto,Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button,input{font:inherit}

  /* ---------- Page chrome ---------- */
  .appbar{position:sticky;top:0;z-index:50;background:rgba(247,241,232,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--cream-line)}
  .appbar-inner{max-width:1280px;margin:auto;min-height:64px;padding:10px 24px;display:flex;align-items:center;gap:18px}
  .brand{display:flex;align-items:center;gap:10px;min-width:max-content}
  .brand .g-logo{width:26px;height:26px}
  .brand-title{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
  .brand-title span{color:var(--ink-faint);font-weight:400;font-family:var(--sans);font-size:14px}
  .toolbar{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .field{height:40px;min-width:210px;padding:0 12px;border:1px solid var(--cream-line);border-radius:8px;background:#fff;color:var(--ink);outline:none}
  .field:focus{border-color:var(--google-blue);box-shadow:0 0 0 1px var(--google-blue)}
  .btn{height:40px;padding:0 18px;border-radius:20px;border:1px solid var(--cream-line);background:#fff;color:var(--google-blue);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{border-color:#c6dafc}
  .btn.primary{background:var(--google-blue);border-color:var(--google-blue);color:#fff}
  .btn.primary:hover{background:var(--google-blue-deep)}
  .btn svg{width:18px;height:18px}
  main{max-width:1280px;margin:0 auto;padding:40px 24px 76px}
  .preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;align-items:start}
  figure{margin:0;background:#fffdf9;border:1px solid var(--cream-line);border-radius:16px;padding:28px;box-shadow:0 1px 3px rgba(60,50,30,.06);display:flex;flex-direction:column;align-items:center;min-height:360px}
  figure.plate-figure{grid-column:1/-1}
  .figure-head{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .figure-title{font-size:16px;font-weight:600}
  .figure-size{font-size:12px;color:var(--ink-faint);background:var(--cream);border-radius:12px;padding:5px 9px}
  .die-wrap{position:relative;padding:16px}
  .crop{position:absolute;width:11px;height:11px;opacity:.65}
  .crop.tl{left:0;top:0;border-left:1px solid #8a8074;border-top:1px solid #8a8074}
  .crop.tr{right:0;top:0;border-right:1px solid #8a8074;border-top:1px solid #8a8074}
  .crop.bl{left:0;bottom:0;border-left:1px solid #8a8074;border-bottom:1px solid #8a8074}
  .crop.br{right:0;bottom:0;border-right:1px solid #8a8074;border-bottom:1px solid #8a8074}
  body.hide-crops .crop{display:none}
  .safe-area{position:absolute;inset:4mm;border:1px dashed rgba(28,25,23,.3);border-radius:5px;pointer-events:none;display:none;z-index:9}
  body.show-safe .safe-area{display:block}

  /* ---------- Shared card language ---------- */
  .tap-card{
    position:relative;overflow:hidden;background:var(--cream);
    box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
  }
  .paper-zone{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    flex:1;min-height:0;
  }
  .eyebrow{
    font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--google-blue);
  }
  .headline{
    margin:0;font-family:var(--serif);font-weight:600;color:var(--ink);line-height:1.04;letter-spacing:-.01em;
  }
  .headline .accent{font-style:italic;color:var(--google-blue)}
  .lede{margin:0;color:var(--ink-soft);font-weight:400}
  .venue-chip{
    font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%;
  }

  /* Blue tap stage */
  .tap-stage{
    position:relative;background:var(--google-blue);flex:none;
    display:flex;flex-direction:column;align-items:center;
  }
  .g-badge{
    position:absolute;left:50%;top:0;transform:translate(-50%,-50%);
    border-radius:50%;background:#fff;display:grid;place-items:center;
    box-shadow:0 1px 4px rgba(21,87,176,.35);z-index:3;
  }
  .g-badge .g-logo{display:block}
  .stage-row{display:flex;align-items:center;width:100%}
  .tap-demo{flex:none}
  .tap-demo svg{display:block;width:100%;height:auto}
  .tap-cta{
    margin:0;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;
  }
  .or-scan{color:rgba(255,255,255,.85);font-weight:400;text-align:left}
  .qr-shell{
    flex:none;background:#fff;border-radius:1.6mm;
    box-shadow:0 1px 2px rgba(21,87,176,.3);
  }
  .qr-shell svg{width:100%;height:auto;display:block}
  .tap-btn{
    border-radius:999px;background:var(--gold);color:var(--ink);
    font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:0 2px 0 var(--gold-deep),0 4px 10px rgba(0,0,0,.22);
    border:1px solid var(--gold-deep);
  }

  /* ---------- CR80 Front — guest-readable at arm's length ---------- */
  .card{
    width:85.6mm;height:54mm;border:1px solid #d8cdbc;border-radius:3mm;
  }
  .card.front .paper-zone{
    position:relative;z-index:2;
    flex:0 0 58%;padding:2mm 3.6mm 11.5mm;justify-content:center;gap:.8mm;
    min-height:0;overflow:visible;
  }
  .card.front .eyebrow{font-size:6.5pt;letter-spacing:.13em}
  .card.front .headline{font-size:14.5pt;max-width:78mm;line-height:1.01}
  .card.front .lede{font-size:6.6pt;line-height:1.2;max-width:76mm}
  .card.front .venue-chip{font-size:6pt;letter-spacing:.11em;margin-bottom:.4mm}
  .card.front .g-badge{
    position:absolute;left:50%;top:auto;bottom:-3.5mm;transform:translateX(-50%);
    width:14.5mm;height:14.5mm;flex:none;
    box-shadow:0 2px 6px rgba(28,25,23,.2);
  }
  .card.front .g-badge .g-logo{width:9mm;height:9mm}
  .card.front .tap-stage{
    position:relative;z-index:1;
    flex:0 0 42%;min-height:0;height:auto;
    padding:5.5mm 3.4mm 2.2mm;justify-content:center;align-items:center;
    overflow:hidden;
  }
  .card.front .stage-action{
    display:flex;flex-direction:column;align-items:center;gap:1.2mm;
    width:100%;margin-top:0;
  }
  .card.front .stage-stars{display:flex;align-items:center;justify-content:center;gap:1.1mm}
  .card.front .stage-star{width:3.5mm;height:3.5mm;fill:#fbbc04;stroke:#f9ab00;stroke-width:1}
  .card.front .front-tap-btn{
    min-height:7.2mm;padding:0 5mm;font-size:10.5pt;gap:1.5mm;letter-spacing:.08em;
    box-shadow:0 1.5px 0 var(--gold-deep),0 2px 6px rgba(0,0,0,.2);
  }
  .card.front .front-tap-btn .nfc-waves{width:4mm;height:4mm;flex:none}

  /* ---------- CR80 Back ---------- */
  .card.back{background:var(--cream)}
  .blue-strip{
    position:relative;background:var(--google-blue);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;text-align:center;
  }
  .card.back .blue-strip{min-height:12mm;padding:2.2mm 10mm 2mm}
  .card.back .blue-strip .headline{color:#fff;font-size:10.5pt;line-height:1.08}
  .strip-g{
    position:absolute;right:3.2mm;top:50%;transform:translateY(-50%);
    width:7mm;height:7mm;border-radius:50%;background:#fff;display:grid;place-items:center;
  }
  .strip-g .g-logo{width:4.4mm;height:4.4mm}
  .card.back .paper-zone{padding:2.2mm 4mm 1.8mm;align-items:stretch;text-align:left;gap:0}
  .back-body{display:flex;gap:2.8mm;flex:1;min-height:0;align-items:center}
  .qr-panel{
    flex:none;display:flex;flex-direction:column;align-items:center;gap:.6mm;
    background:#fff;border:1px solid var(--cream-line);border-radius:2mm;
    padding:1.3mm 1.4mm;box-shadow:0 1px 2px rgba(60,50,30,.1);
  }
  .qr-panel .qr-label{font-size:5.2pt;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--google-blue)}
  .qr-panel .qr-caption{font-size:4.8pt;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .card.back .qr-shell{width:19.5mm;box-shadow:none;border-radius:.8mm}
  .back-steps{display:flex;flex-direction:column;gap:1.5mm;flex:1;justify-content:center}
  .back-step{display:grid;grid-template-columns:11mm 1fr;gap:2.2mm;align-items:center}
  .back-num{
    font-family:var(--serif);font-weight:900;font-size:20pt;line-height:.9;
    color:var(--google-blue);text-align:center;
  }
  .back-step strong{display:block;font-size:9.5pt;font-weight:800;letter-spacing:.1em;line-height:1;color:var(--ink)}
  .back-step div > span{display:block;font-size:6pt;color:var(--ink-soft);line-height:1.2;margin-top:.4mm}
  .back-meta{
    display:flex;justify-content:space-between;align-items:end;gap:2mm;
    border-top:1px solid var(--cream-line);padding-top:1.5mm;margin-top:1.2mm;
  }
  .back-meta .venue-text{font-size:6.4pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
  .back-meta .hint{font-size:5.6pt;color:var(--ink-faint)}

  /* ---------- Plate — same language as front card ---------- */
  .plate{width:100mm;height:100mm;border:1px solid #d8cdbc;border-radius:3.5mm}
  .plate .paper-zone{
    position:relative;z-index:2;
    flex:0 0 53%;padding:4.5mm 6.5mm 16.5mm;justify-content:center;gap:1.8mm;
    min-height:0;overflow:visible;
  }
  .plate .eyebrow{font-size:8.5pt;letter-spacing:.15em}
  .plate .headline{font-size:22pt;max-width:88mm;line-height:1.02}
  .plate .lede{font-size:8.6pt;line-height:1.3;max-width:84mm}
  .plate .venue-chip{font-size:7.5pt;letter-spacing:.12em;margin-bottom:.4mm}
  .plate .g-badge{
    position:absolute;left:50%;top:auto;bottom:-9mm;transform:translateX(-50%);
    width:18mm;height:18mm;flex:none;
    box-shadow:0 2px 8px rgba(28,25,23,.22);
  }
  .plate .g-badge .g-logo{width:11.2mm;height:11.2mm}
  .plate .tap-stage{
    position:relative;z-index:1;
    flex:0 0 47%;min-height:0;height:auto;
    padding:8.5mm 6mm 3.2mm;justify-content:center;align-items:center;gap:1.6mm;
    overflow:hidden;
  }
  .plate .stage-action{
    display:flex;flex-direction:column;align-items:center;gap:1.6mm;width:100%;
  }
  .plate .stage-stars{display:flex;align-items:center;justify-content:center;gap:1.6mm}
  .plate .stage-star{width:4.8mm;height:4.8mm;fill:#fbbc04;stroke:#f9ab00;stroke-width:1}
  .plate .plate-tap-btn{
    min-height:11mm;padding:0 11mm;font-size:13.5pt;gap:2mm;letter-spacing:.08em;
    box-shadow:0 2px 0 var(--gold-deep),0 3px 8px rgba(0,0,0,.22);
  }
  .plate .plate-tap-btn .nfc-waves{width:5mm;height:5mm;flex:none}
  .plate .fallback-row{display:flex;align-items:center;justify-content:center;gap:2.8mm;margin-top:0}
  .plate .or-scan{font-size:7pt;max-width:40mm;text-align:right;line-height:1.25}
  .plate .qr-shell{width:17mm;padding:1mm}

  /* ---------- Misc ---------- */
  .switch{display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:13px;cursor:pointer;user-select:none}
  .switch input{appearance:none;width:36px;height:20px;border-radius:10px;background:#cbc1b0;position:relative;cursor:pointer;transition:.2s}
  .switch input:before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;left:2px;top:2px;background:#fff;box-shadow:0 1px 3px rgba(60,50,30,.35);transition:.2s}
  .switch input:checked{background:var(--google-blue)}
  .switch input:checked:before{transform:translateX(16px)}
  @media(max-width:900px){
    .appbar-inner{align-items:flex-start;flex-direction:column}.toolbar{margin-left:0;width:100%;justify-content:flex-start}.field{flex:1}.preview-grid{grid-template-columns:1fr}.plate-figure{grid-column:auto}
  }
  @media(max-width:520px){
    main{padding:28px 10px 60px}.appbar-inner{padding:12px}.toolbar{gap:8px}.field{min-width:100%;width:100%}.btn{flex:1;justify-content:center}figure{padding:16px 8px;border-radius:12px;overflow:hidden}.die-wrap{transform-origin:top center}.card-die{transform:scale(.91);margin-bottom:-18px}.plate-die{transform:scale(.82);margin-bottom:-72px}
  }
  @media print{
    @page{size:A4 landscape;margin:10mm}
    body{background:#fff}.appbar,.figure-head{display:none!important}main{max-width:none;padding:0}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12mm}.plate-figure{grid-column:1/-1}figure{border:0;box-shadow:none;padding:0;min-height:0;break-inside:avoid;background:none}.tap-card{box-shadow:none}.die-wrap{padding:8mm}.crop{display:block!important}
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <svg class="g-logo" width="26" height="26" viewBox="0 0 24 24" aria-label="Google"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.36l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.13H3.05v2.62A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.93A6.02 6.02 0 0 1 6.08 12c0-.67.12-1.32.32-1.93V7.45H3.05A10 10 0 0 0 2 12c0 1.62.39 3.15 1.05 4.55l3.35-2.62Z"/><path fill="#EA4335" d="M12 5.94c1.47 0 2.78.5 3.82 1.5l2.86-2.87A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.95 5.45l3.35 2.62C7.19 7.7 9.4 5.94 12 5.94Z"/></svg>
      <div class="brand-title">Old Crown Girton <span>reviews</span></div>
    </div>
    <div class="toolbar">
      <input class="field" id="venueInput" aria-label="Venue name" value="Old Crown Girton">
      <label class="switch"><input type="checkbox" id="cropToggle" checked><span>Crop marks</span></label>
      <label class="switch"><input type="checkbox" id="safeToggle"><span>Safe area</span></label>
      <button class="btn primary" id="printBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg> Print</button>
    </div>
  </div>
</header>
<main>

  <section class="preview-grid">
    <figure>
      <div class="figure-head"><span class="figure-title">Front</span><span class="figure-size">85.6 × 54 mm · CR80</span></div>
      <div class="die-wrap card-die">
        <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>
        <article class="tap-card card front">
          <div class="safe-area"></div>
          <div class="paper-zone">
            <div class="eyebrow">A Quick Favor For Your Local</div>
            <h2 class="headline">Loved Your <span class="accent">Pint&nbsp;in&nbsp;Girton?</span></h2>
            <p class="lede">Local pubs survive on word-of-mouth. Tap your phone below to leave a quick Google review and help others find Girton’s best pub — it takes less than 10 seconds.</p>
            <div class="venue-chip venue-text">Old Crown Girton</div>
            <div class="g-badge" aria-hidden="true"><svg class="g-logo" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.36l-3.24-2.54c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.13H3.05v2.62A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.93A6.02 6.02 0 0 1 6.08 12c0-.67.12-1.32.32-1.93V7.45H3.05A10 10 0 0 0 2 12c0 1.62.39 3.15 1.05 4.55l3.35-2.62Z"/><path fill="#EA4335" d="M12 5.94c1.47 0 2.78.5 3.82 1.5l2.86-2.87A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.95 5.45l3.35 2.62C7.19 7.7 9.4 5.94 12 5.94Z"/></svg></div>
          </div>
          <div class="tap-stage">
            <div class="stage-action">
              <div class="stage-stars" aria-hidden="true"><svg class="stage-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.4 2.9 5.88 6.5.95-4.7 4.58 1.11 6.47L12 17.77 6.19 20.28l1.11-6.47-4.7-4.58 6.5-.95Z"/></svg><svg class="stage-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.4 2.9 5.88 6.5.95-4.7 4.58 1.11 6.47L12 17.77 6.19 20.28l1.11-6.47-4.7-4.58 6.5-.95Z"/></svg><svg class="stage-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.4 2.9 5.88 6.5.95-4.7 4.58 1.11 6.47L12 17.77 6.19 20.28l1.11-6.47-4.7-4.58 6.5-.95Z"/></svg><svg class="stage-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.4 2.9 5.88 6.5.95-4.7 4.58 1.11 6.47L12 17.77 6.19 20.28l1.11-6.47-4.7-4.58 6.5-.95Z"/></svg><svg class="stage-star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.4 2.9 5.88 6.5.95-4.7 4.58 1.11 6.47L12 17.77 6.19 20.28l1.11-6.47-4.7-4.58 6.5-.95Z"/></svg></div>
              <div class="tap-btn front-tap-btn">
                <svg class="nfc-waves" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 8.5a5 5 0 0 1 0 7"/><path d="M9.5 6a8.5 8.5 0 0 1 0 12"/><circle cx="3.2" cy="12" r="1.35" fill="currentColor" stroke="none"/></svg>
                Tap to Review
              </div>
            </div>
          </div>
        </article>
      </div>
    </figure>

    <figure>
      <div class="figure-head"><span class="figure-title">Back</span><span class="figure-size">85.6 × 54 mm · CR80</span></div>
      <div class="die-wrap card-die">
        <span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>
        <article class="tap-card card back">
          <div class="safe-area"></div>
